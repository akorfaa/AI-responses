function baseName(t){return t.replace(/\s*\([^)]*\)/g,'').trim().toLowerCase()}

PH.forEach(function(p,i){p.id='ph-'+i});
var BYID={};TERMS.forEach(function(x){BYID[x.id]=x});PH.forEach(function(p){BYID[p.id]=p});

var store={cards:{},days:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var pp=JSON.parse(raw);if(pp&&pp.cards){store=pp;if(!store.days)store.days={}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

var CFG={track:'all',focus:'mix',len:20,reverse:false,note:''};
var Sess=null;

/* ---------- scheduling ---------- */
function review(id,grade){
  var c=store.cards[id]||{b:0,d:0,n:0,m:0};
  c.n++;
  if(grade===0){c.b=0;c.m++;c.d=Date.now()+10*60000}
  else{c.b=Math.min(5,c.b+(grade===2?2:1));c.d=Date.now()+INT[c.b]*DAY}
  store.cards[id]=c;
  var k=dayKey();store.days[k]=(store.days[k]||0)+1;
  save();
}

/* ---------- masking and question building ---------- */
function maskTerm(text,x){
  var names=[x.t],base=x.t.replace(/\s*\([^)]*\)/g,'').trim();
  if(base&&base!==x.t)names.push(base);
  var m=x.t.match(/\(([^)]+)\)/);if(m)names.push(m[1]);
  x.t.split(/\s+(?:and|vs\.?|or)\s+/i).forEach(function(p){p=p.replace(/\s*\([^)]*\)/g,'').trim();if(p.length>3)names.push(p)});
  var seen={},list=[];
  names.forEach(function(n){var k=n.toLowerCase();if(!seen[k]){seen[k]=1;list.push(n)}});
  list.sort(function(a,b){return b.length-a.length});
  var changed=false;
  list.forEach(function(n){
    var re=new RegExp('(^|[^A-Za-z0-9])('+escRe(n)+')(?![A-Za-z0-9])','gi');
    text=text.replace(re,function(all,pre){changed=true;return pre+'_____'});
  });
  return{text:text,changed:changed};
}
function distractors(x,n){
  var b=baseName(x.t);
  var pool=TERMS.filter(function(y){return y.id!==x.id&&baseName(y.t)!==b});
  var a=shuffle(pool.filter(function(y){return y.k===x.k&&y.c===x.c}));
  var c=shuffle(pool.filter(function(y){return y.k===x.k&&y.c!==x.c}));
  var d=shuffle(pool.filter(function(y){return y.k!==x.k}));
  return a.concat(c,d).slice(0,n);
}
function makeQuestion(item){
  var x=item.x;
  if(item.kind==='phr'){
    var others=shuffle(PH.filter(function(p){return p.id!==x.id})).slice(0,3);
    var opts=shuffle(others.map(function(p){return{text:p.s,ok:false}}).concat([{text:x.s,ok:true}]));
    return{label:'Which is the senior way to say it?',prompt:'“'+x.b+'”',opts:opts,kind:'phr'};
  }
  var type=item.qtype,prompt;
  if(type==='ctx'){
    var r=maskTerm(x.e,x);
    if(r.changed)prompt=r.text;else type='def';
  }
  if(type==='def')prompt=maskTerm(x.m,x).text;
  var opts2=shuffle(distractors(x,3).map(function(y){return{text:y.t,ok:false}}).concat([{text:x.t,ok:true}]));
  return{label:type==='ctx'?'Which term completes this sentence?':'Which term matches this definition?',prompt:prompt,opts:opts2,kind:type};
}

/* ---------- queue ---------- */
function pool(kind){
  if(kind==='phr')return PH.filter(function(p){return CFG.track==='all'||p.k===CFG.track});
  return TERMS.filter(function(x){return CFG.track==='all'||x.k===CFG.track});
}
function ordered(list){
  var now=Date.now(),due=[],nw=[],learn=[],weak=[];
  list.forEach(function(x){
    var s=store.cards[x.id];
    if(!s)nw.push(x);else{if(s.d<=now)due.push(x);else learn.push(x);if(s.m>=2||s.b<=1)weak.push(x)}
  });
  due.sort(function(a,b){return store.cards[a.id].d-store.cards[b.id].d});
  if(CFG.focus==='due')return due;
  if(CFG.focus==='new')return shuffle(nw);
  if(CFG.focus==='weak')return shuffle(weak);
  return due.concat(shuffle(nw),shuffle(learn));
}
function buildQueue(mode,ids){
  var n=CFG.len,items=[];
  if(ids){
    ids.forEach(function(id){var x=BYID[id];if(!x)return;
      var isP=id.indexOf('ph-')===0;
      items.push({id:id,x:x,kind:isP?'phr':'term',qtype:isP?'phr':(mode==='mixed'?(Math.random()<.5?'def':'ctx'):mode)});
    });
    return items;
  }
  if(mode==='phr'){
    ordered(pool('phr')).slice(0,n).forEach(function(x){items.push({id:x.id,x:x,kind:'phr',qtype:'phr'})});
  }else if(mode==='mixed'){
    var T=ordered(pool('term')),P=ordered(pool('phr')),ti=0,pi=0;
    for(var i=0;i<n;i++){
      var wantP=(i%4===3);
      if(wantP&&pi<P.length){var p=P[pi++];items.push({id:p.id,x:p,kind:'phr',qtype:'phr'})}
      else if(ti<T.length){var t=T[ti++];items.push({id:t.id,x:t,kind:'term',qtype:Math.random()<.5?'def':'ctx'})}
      else if(pi<P.length){var p2=P[pi++];items.push({id:p2.id,x:p2,kind:'phr',qtype:'phr'})}
    }
  }else{
    var tp=pool('term');
    if(mode==='ctx')tp=tp.filter(function(x){return maskTerm(x.e,x).changed});
    ordered(tp).slice(0,n).forEach(function(x){items.push({id:x.id,x:x,kind:'term',qtype:mode})});
  }
  return items;
}

/* ---------- stats ---------- */
function stats(){
  var now=Date.now(),mast=0,learn=0,due=0;
  TERMS.forEach(function(x){var s=store.cards[x.id];if(s){if(s.b>=4)mast++;else learn++;if(s.d<=now)due++}});
  var streak=0,d=new Date();
  if(!store.days[dayKey(d)])d.setDate(d.getDate()-1);
  while(store.days[dayKey(d)]){streak++;d.setDate(d.getDate()-1)}
  return{mast:mast,learn:learn,due:due,nw:TERMS.length-mast-learn,streak:streak,today:store.days[dayKey()]||0};
}

/* ---------- rendering ---------- */
function detail(x){
  return '<div class="det">'+
   '<div class="fld"><span class="lab">Meaning</span><p class="opp">'+esc(x.m)+'</p></div>'+
   '<div class="fld"><span class="lab">Example of usage</span><p class="ex">'+esc(x.e)+'</p></div>'+
   '<div class="fld"><span class="lab">Related terms</span><div class="rels">'+x.r.map(function(r){return '<span class="rel">'+esc(r)+'</span>'}).join('')+'</div></div>'+
   '<div class="fld"><span class="lab">Opposite or contrast</span><p class="opp">'+esc(x.o)+'</p></div>'+
  '</div>';
}
function tags(x){return '<div class="tags"><span class="tag t-'+x.k+'">'+esc(TN[x.k]||x.k)+'</span>'+(x.c?'<span class="tag cat">'+esc(x.c)+'</span>':'')+'</div>'}

function renderHome(){
  Sess=null;
  var st=stats(),n=TERMS.length;
  var h='';
  h+='<div class="stats">'+
    '<div class="stat due"><b>'+st.due+'</b><span>due now</span></div>'+
    '<div class="stat"><b>'+st.nw+'</b><span>new terms</span></div>'+
    '<div class="stat"><b>'+st.mast+'</b><span>mastered of '+n+'</span></div>'+
    '<div class="stat"><b>'+st.streak+'</b><span>day streak</span></div>'+
  '</div>';
  h+='<button class="start" data-act="start" data-mode="mixed"><span>Start daily practice<small>'+CFG.len+' items: due terms first, then new ones, with a phrasing question every few cards</small></span><span aria-hidden="true">→</span></button>';
  if(CFG.note)h+='<p class="note">'+esc(CFG.note)+'</p>';
  h+='<section class="section"><h2>Or choose a mode</h2><div class="modes">'+
    '<button class="mode" data-act="start" data-mode="flash"><b>Flashcards</b><span>Recall the meaning, flip, rate yourself. Your rating sets when it returns.</span></button>'+
    '<button class="mode" data-act="start" data-mode="def"><b>Definition quiz</b><span>Pick the term that matches a definition.</span></button>'+
    '<button class="mode" data-act="start" data-mode="ctx"><b>In-context quiz</b><span>Pick the term that completes a real usage sentence.</span></button>'+
    '<button class="mode" data-act="start" data-mode="phr"><b>Senior phrasing</b><span>Pick the senior way to say what a beginner said.</span></button>'+
  '</div></section>';
  h+='<section class="section"><h2>Practice settings</h2><div class="chips" id="tchips" role="group" aria-label="Track">'+
    ['all'].concat(ORDER).map(function(k){return '<button class="chip" data-act="track" data-k="'+k+'" aria-pressed="'+(CFG.track===k)+'">'+(k==='all'?'All tracks':esc(TN[k]))+'</button>'}).join('')+
  '</div><div class="settings">'+
    '<label>Focus <select id="focus"><option value="mix">Due, then new</option><option value="due">Due only</option><option value="new">New only</option><option value="weak">Weak spots</option></select></label>'+
    '<label>Length <select id="len"><option>10</option><option>20</option><option>30</option><option>50</option></select></label>'+
    '<label><input type="checkbox" id="rev"> Flashcards: show meaning first</label>'+
  '</div></section>';
  h+='<section class="section"><h2>Progress by track</h2><div class="tracks">'+
    ORDER.map(function(k){
      var tot=0,m=0,l=0;
      TERMS.forEach(function(x){if(x.k===k){tot++;var s=store.cards[x.id];if(s){if(s.b>=4)m++;else l++}}});
      return '<div class="trow"><span class="nm">'+esc(TN[k])+'</span><div class="tbar"><i class="m" style="width:'+(m/tot*100)+'%"></i><i class="l" style="width:'+(l/tot*100)+'%"></i></div><span class="ct">'+m+'/'+tot+'</span></div>';
    }).join('')+
  '</div><div class="legend"><span><i class="dot" style="background:var(--good)"></i>mastered</span><span><i class="dot" style="background:var(--warn)"></i>learning</span><span><i class="dot" style="background:var(--line)"></i>new</span></div></section>';
  h+='<details class="bk"><summary>Backup and reset</summary><p>Copy this text somewhere safe to keep your progress, or paste a saved copy and restore it.</p><textarea id="bkText" aria-label="Progress backup"></textarea><div class="row"><button class="btn small" data-act="bkcopy">Copy progress</button><button class="btn small" data-act="bkrestore">Restore from text</button><button class="btn small" data-act="reset" id="resetBtn">Reset all progress</button></div><p id="bkMsg"></p></details>';
  $('app').innerHTML=h;
  $('focus').value=CFG.focus;$('len').value=String(CFG.len);$('rev').checked=CFG.reverse;
  $('sub').textContent=n+' terms and '+PH.length+' phrasing swaps from both inventories, practiced with spaced repetition. '+(st.today?'You have done '+st.today+' reviews today.':'Start with a short session today.');
}

function progressBar(){
  var done=Sess.i,total=Sess.queue.length;
  return '<div class="sbar"><button class="linkbtn" data-act="quit">End session</button><div class="prog"><i style="width:'+(done/total*100)+'%"></i></div><span class="n">'+(Math.min(done+1,total))+' / '+total+'</span></div>';
}

function renderFlash(){
  var it=Sess.queue[Sess.i],x=it.x,h=progressBar();
  var rev=CFG.reverse&&it.kind==='term';
  if(!Sess.flipped){
    h+='<div class="card">'+tags(x);
    if(rev){h+='<div class="center"><span class="qlab">Which term is this?</span><p class="q">'+esc(maskTerm(x.m,x).text)+'</p></div>'}
    else{h+='<div class="center"><p class="big">'+esc(x.t)+'</p><p class="hint">Say the meaning and one example out loud, then reveal.</p></div>'}
    h+='</div><div class="actions"><button class="btn primary" data-act="flip" id="mainBtn">Reveal <kbd>space</kbd></button></div>';
  }else{
    h+='<div class="card">'+tags(x)+'<p class="big">'+esc(x.t)+'</p>'+detail(x)+'</div>'+
      '<div class="actions"><button class="btn again" data-act="grade" data-g="0">Again <kbd>1</kbd></button><button class="btn" data-act="grade" data-g="1" id="mainBtn">Good <kbd>2</kbd></button><button class="btn easy" data-act="grade" data-g="2">Easy <kbd>3</kbd></button></div>'+
      '<p class="hint" style="margin-top:10px">Again: back soon. Good: next interval. Easy: skip ahead.</p>';
  }
  $('app').innerHTML=h;focusMain();
}

function renderQuiz(){
  var it=Sess.queue[Sess.i];
  if(!Sess.q)Sess.q=makeQuestion(it);
  var q=Sess.q,h=progressBar();
  h+='<div class="card"><span class="qlab">'+esc(q.label)+'</span><p class="q">'+esc(q.prompt)+'</p><div class="opts">'+
    q.opts.map(function(o,i){
      var cls='opt';
      if(Sess.answered){if(o.ok)cls+=' right';else if(i===Sess.picked)cls+=' wrong'}
      return '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(Sess.answered?' disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(o.text)+'</span></button>';
    }).join('')+'</div>';
  if(Sess.answered){
    var ok=q.opts[Sess.picked].ok;
    h+='<div class="fb" role="status"><span class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct':'Not quite')+(ok?'':'. The answer is highlighted.')+'</span>';
    if(it.kind==='term')h+=tags(it.x)+'<p class="big" style="font-size:20px">'+esc(it.x.t)+'</p>'+detail(it.x);
    else h+='<div class="fld"><span class="lab">Why this works</span><p class="opp">Senior phrasing names the cause or the data, states a next step, and avoids vague words like fine or broken.</p></div>';
    h+='</div>';
  }
  h+='</div>';
  if(Sess.answered)h+='<div class="actions"><button class="btn primary" data-act="next" id="mainBtn">'+(Sess.i+1>=Sess.queue.length?'Finish':'Next')+' <kbd>space</kbd></button></div>';
  $('app').innerHTML=h;focusMain();
}
function focusMain(){var b=$('mainBtn');if(b){try{b.focus({preventScroll:true})}catch(e){}}}

function renderSession(){
  if(Sess.i>=Sess.queue.length)return renderEnd();
  var it=Sess.queue[Sess.i];
  Sess.view=(Sess.mode==='flash'&&it.kind==='term')?'flash':'quiz';
  if(Sess.view==='flash')renderFlash();else renderQuiz();
  window.scrollTo({top:0});
}

function renderEnd(){
  var tot=Sess.first,ok=Sess.firstOk;
  var pct=tot?Math.round(ok/tot*100):0;
  var miss=Sess.missed;
  var h='<div class="card"><span class="qlab">Session complete</span><p class="big2">'+ok+'<span style="color:var(--muted);font-size:24px"> / '+tot+'</span></p><p class="hint">'+pct+'% right on the first try. '+(pct>=85?'Strong. These will return after longer gaps.':pct>=60?'Solid progress. Missed items come back sooner.':'Good, this is where learning happens. Missed items come back soon.')+'</p>';
  if(miss.length){
    h+='<div class="fld"><span class="lab">Worth another look</span><div class="miss">'+
      miss.map(function(id){var x=BYID[id];return id.indexOf('ph-')===0?'<div class="mi"><b>'+esc(x.s)+'</b></div>':'<div class="mi"><b>'+esc(x.t)+'</b><p>'+esc(x.m)+'</p></div>'}).join('')+'</div></div>';
  }
  h+='</div><div class="actions">'+(miss.length?'<button class="btn primary" data-act="again-missed">Practice missed items</button>':'')+'<button class="btn'+(miss.length?'':' primary')+'" data-act="home">Back to dashboard</button></div>';
  $('app').innerHTML=h;window.scrollTo({top:0});
}

/* ---------- session control ---------- */
function startSession(mode,ids){
  var q=buildQueue(mode,ids);
  if(!q.length){CFG.note='Nothing matches that focus and track right now. Try "Due, then new", or pick another track.';renderHome();window.scrollTo({top:0});return}
  CFG.note='';
  Sess={mode:mode,queue:q,i:0,flipped:false,answered:false,picked:-1,q:null,first:0,firstOk:0,missed:[]};
  renderSession();
}
function nextItem(){Sess.i++;Sess.flipped=false;Sess.answered=false;Sess.picked=-1;Sess.q=null;renderSession()}
function record(correct){
  var it=Sess.queue[Sess.i];
  if(!it.rq){
    Sess.first++;if(correct)Sess.firstOk++;
    if(!correct&&Sess.missed.indexOf(it.id)<0)Sess.missed.push(it.id);
  }
  if(!correct&&!it.rq){Sess.queue.push({id:it.id,x:it.x,kind:it.kind,qtype:it.qtype,rq:true})}
}
function gradeCard(g){
  var it=Sess.queue[Sess.i];
  review(it.id,g);record(g>0);nextItem();
}
function pick(i){
  if(Sess.answered)return;
  var it=Sess.queue[Sess.i],ok=Sess.q.opts[i].ok;
  Sess.answered=true;Sess.picked=i;
  review(it.id,ok?1:0);record(ok);
  renderQuiz();
}

/* ---------- events ---------- */
$('app').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='start'){startSession(t.getAttribute('data-mode'))}
  else if(a==='track'){CFG.track=t.getAttribute('data-k');renderHome()}
  else if(a==='flip'){Sess.flipped=true;renderFlash()}
  else if(a==='grade'){gradeCard(+t.getAttribute('data-g'))}
  else if(a==='pick'){pick(+t.getAttribute('data-i'))}
  else if(a==='next'){nextItem()}
  else if(a==='quit'){renderEnd0()}
  else if(a==='home'){renderHome();window.scrollTo({top:0})}
  else if(a==='again-missed'){var ids=Sess.missed.slice();var m=Sess.mode;startSession(m==='flash'||m==='def'||m==='ctx'||m==='phr'||m==='mixed'?m:'mixed',ids)}
  else if(a==='bkcopy'){
    var ta=$('bkText');ta.value=JSON.stringify(store);ta.focus();ta.select();
    var msg='Selected. Copy it with your keyboard if the button could not.';
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){$('bkMsg').textContent='Copied to clipboard.'},function(){$('bkMsg').textContent=msg});return}}catch(er){}
    $('bkMsg').textContent=msg;
  }
  else if(a==='bkrestore'){
    try{var p=JSON.parse($('bkText').value);if(!p||typeof p.cards!=='object')throw 0;store={cards:p.cards,days:p.days||{}};save();renderHome();window.scrollTo({top:0})}
    catch(er){$('bkMsg').textContent='That text is not a valid backup.'}
  }
  else if(a==='reset'){
    if(t.getAttribute('data-arm')){store={cards:{},days:{}};save();renderHome()}
    else{t.setAttribute('data-arm','1');t.textContent='Tap again to erase everything';setTimeout(function(){if(t&&t.isConnected){t.removeAttribute('data-arm');t.textContent='Reset all progress'}},4000)}
  }
});
function renderEnd0(){if(Sess&&Sess.first>0){Sess.i=Sess.queue.length;renderEnd()}else{renderHome();window.scrollTo({top:0})}}
$('app').addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='focus')CFG.focus=t.value;
  else if(t.id==='len'){CFG.len=+t.value;renderHome()}
  else if(t.id==='rev')CFG.reverse=t.checked;
});
document.addEventListener('keydown',function(e){
  if(!Sess||Sess.i>=Sess.queue.length)return;
  var tag=e.target.tagName;if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  var k=e.key;
  if(Sess.view==='flash'){
    if(!Sess.flipped&&(k===' '||k==='Enter')&&tag!=='BUTTON'){e.preventDefault();Sess.flipped=true;renderFlash()}
    else if(Sess.flipped&&(k==='1'||k==='2'||k==='3')){gradeCard(+k-1)}
  }else if(Sess.view==='quiz'){
    if(!Sess.answered&&k>='1'&&k<='4'){pick(+k-1)}
    else if(Sess.answered&&(k===' '||k==='Enter')&&tag!=='BUTTON'){e.preventDefault();nextItem()}
  }
});

renderHome();
})();
</script>
