T("vector index (HNSW, IVF)","dt","Databases","Index structures that speed up nearest-neighbor search over embeddings by trading a little accuracy for large speedups. HNSW is graph-based; IVF clusters vectors.","HNSW gives high recall at low latency but uses more memory.","approximate nearest neighbor|recall|ef_search|quantization|pgvector|index build","Brute-force exact search");
T("JSON, YAML and CSV","dt","Formats","Common data formats. JSON is nested and ubiquitous in APIs. YAML is human-friendly configuration. CSV is flat tabular text with no types or nesting.","Config is YAML, API payloads are JSON, exports are CSV.","Parquet|Avro|schema|serialization|encoding|delimiter","Binary or columnar formats");
T("Protocol Buffers (Protobuf)","dt","Formats","A compact binary serialization format with a defined schema, used with gRPC. Smaller and faster than JSON, with built-in schema evolution rules.","Protobuf messages are smaller and typed, at the cost of readability.","gRPC|schema|backward compatibility|binary format|field numbers|Avro","Human-readable JSON");

T("Git branch and commit","dt","Git & delivery","A commit is a saved snapshot of changes with a message. A branch is a movable pointer to a line of commits, letting work proceed in parallel.","Create a branch, make small commits, then open a pull request.","merge|HEAD|history|checkout|remote|atomic commit","Editing without version control");
T("rebase vs merge","dt","Git & delivery","Merge joins two histories with a merge commit. Rebase replays your commits on top of another branch for a linear history. Never rebase shared public branches.","Rebase your feature branch onto main before merging for a clean history.","fast-forward|squash|merge commit|force push|linear history|conflict","Leaving divergent branches");
T("cherry-pick","dt","Git & delivery","Applying a single specific commit from one branch onto another, often to backport a fix.","Cherry-pick the hotfix onto the release branch.","backport|hotfix|commit hash|release branch|merge","Merging the whole branch");
T("git stash","dt","Git & delivery","Temporarily shelving uncommitted changes so you can switch tasks, then restoring them later.","Stash your changes, check out main, fix the typo, then pop the stash.","stash pop|work in progress|working tree|checkout|branch","Committing unfinished work");
T("monorepo vs polyrepo","dt","Git & delivery","A monorepo keeps many projects in one repository, easing shared code and atomic changes. A polyrepo uses a repository per project, giving independence but harder cross-cutting changes.","The monorepo lets one commit update the library and every service using it.","Bazel|Nx|code ownership|atomic change|build caching|versioning","Each is the alternative of the other");
T("build artifact","dt","Git & delivery","The packaged output of a build (a binary, container image, wheel, bundle) that gets stored and deployed, ideally built once and promoted across environments.","Build once, promote the same artifact from staging to production.","artifact repository|container image|versioning|immutable build|reproducible build|registry","Rebuilding separately per environment");
T("compiled vs interpreted languages","dt","Languages","Compiled languages (C, Rust, Go) are translated to machine code ahead of time for speed. Interpreted languages (Python, Ruby) run via an interpreter at runtime for flexibility. Many are in between with bytecode and JIT.","Python is interpreted; Go compiles to a single binary.","bytecode|JIT|runtime|static typing|performance|VM","Each is the other: speed vs flexibility");
T("JIT compilation","dt","Languages","Just-in-time compilation: translating code to machine code while the program runs, optimizing hot paths based on actual behavior (Java, JavaScript engines).","JIT warmup explains why the first requests are slower.","warmup|bytecode|hot path|AOT|interpreter|V8","Ahead-of-time (AOT) compilation");
T("static vs dynamic typing","dt","Languages","Static typing checks types before running (Java, Rust, TypeScript). Dynamic typing checks at runtime (Python, JavaScript). Gradual typing adds optional hints.","TypeScript added static types to a dynamic language to catch bugs earlier.","type hints|mypy|type inference|gradual typing|runtime error|compile-time","Each is the opposite approach");
T("garbage-collected vs manual memory","dt","Languages","Garbage-collected languages free unused memory automatically. Others require manual management (C) or ownership rules checked at compile time (Rust).","Rust's ownership model gives memory safety without a garbage collector.","ownership|borrow checker|malloc / free|memory safety|dangling pointer|GC pause","Each is a different safety/performance trade-off");
T("assertion","dt","Languages","A statement that checks something that must be true, failing loudly if not. Used to catch bugs early and document assumptions.","Assert that the list is non-empty before indexing.","precondition|invariant|fail fast|unit test|contract|defensive programming","Silently assuming it is true");
T("breakpoint and debugger","dt","Languages","A breakpoint pauses execution at a chosen line. A debugger lets you inspect variables, step through code and watch values change.","Set a breakpoint at the failing function and step through.","step over / into|watch expression|call stack|conditional breakpoint|print debugging|logging","Print statement debugging");
T("shell, bash and pipes","dt","Languages","The shell is a command-line interface; bash is a common one. A pipe (|) sends one command's output into another's input, letting small tools be chained.","cat log.txt | grep ERROR | sort | uniq -c counts error types.","CLI|stdin / stdout|grep|awk|sed|script","Graphical interface only");
T("exit code","dt","Languages","A number a program returns when it finishes: 0 means success, non-zero means failure. CI systems and scripts rely on it to decide what to do next.","The deploy script exited with code 1, so the pipeline stopped.","stdout / stderr|success / failure|set -e|signal|CI job|error handling","Silent failure with exit 0");
T("makefile and task runners","dt","Languages","Tools that name common project commands (build, test, lint) so everyone runs them the same way: make, npm scripts, just, tox.","make test runs the same checks locally and in CI.","Makefile|npm scripts|CI|dev environment|automation|reproducibility","Memorized ad hoc command lines");
/* ARCHITECTURE, NETWORKING & CLOUD */
T("API gateway","ar","Networking","A single entry point in front of services that handles routing, authentication, rate limiting and logging, so each service does not repeat them.","The API gateway authenticates requests and routes /orders to the orders service.","reverse proxy|rate limiting|routing|BFF|auth offloading|Kong","Clients calling every service directly");
T("reverse proxy","ar","Networking","A server that sits in front of back-end servers, forwarding client requests and often adding caching, TLS termination and load balancing (nginx, Envoy).","nginx terminates TLS and reverse proxies to the app servers.","load balancer|TLS termination|caching|nginx|Envoy|forward proxy","Forward proxy (acts for clients)");
T("DNS","ar","Networking","The Domain Name System translates names like example.com into IP addresses. Caching and TTLs make changes take time to propagate, and DNS is a frequent outage cause.","It's always DNS: the TTL was an hour, so the old IP stuck around.","A / CNAME record|TTL|resolver|propagation|nameserver|latency","Raw IP addresses");
T("TCP vs UDP","ar","Networking","TCP is reliable and ordered: it retransmits lost packets, with extra latency. UDP is lightweight with no guarantees, useful for real-time media and games.","Video calls prefer UDP; a lost frame is not worth waiting for.","packet loss|handshake|congestion control|QUIC|latency|reliability","Each is the other's trade-off");
T("HTTP/2 and HTTP/3","ar","Networking","Newer HTTP versions. HTTP/2 multiplexes many requests over one connection. HTTP/3 runs over QUIC (UDP) to cut connection setup and head-of-line blocking.","Moving to HTTP/3 reduced page load on lossy mobile networks.","multiplexing|QUIC|head-of-line blocking|keep-alive|TLS|HTTP/1.1","HTTP/1.1 one request per connection");
T("TLS and HTTPS","ar","Networking","TLS encrypts traffic between client and server and verifies the server's identity with certificates. HTTPS is HTTP over TLS.","The cert expired at midnight, so every client got an error: automate renewal.","certificate|handshake|mTLS|CA|encryption in transit|certificate rotation","Plain HTTP");
T("WebSocket","ar","Networking","A persistent two-way connection between client and server, letting either side send messages any time, used for chat, live dashboards and collaboration.","The dashboard receives updates over a WebSocket instead of polling.","server-sent events|polling|full-duplex|real-time|push|connection state","Request-response HTTP");
T("webhook","ar","Networking","An HTTP callback: when an event happens, one system sends a POST to a URL you provide, instead of you repeatedly asking for changes.","Stripe calls our webhook when a payment succeeds; verify the signature and make the handler idempotent.","callback URL|signature verification|retry|idempotent|event|polling","Polling an API for changes");
T("polling vs push","ar","Networking","Polling repeatedly asks a server whether anything changed. Push (webhooks, WebSockets, server-sent events) has the server notify you when something happens.","Polling every second wastes calls; subscribe to push events instead.","long polling|webhook|SSE|pub/sub|latency|load","Each is the other's alternative");
T("gRPC","ar","Networking","A high-performance RPC framework using Protocol Buffers over HTTP/2, with generated clients and streaming. Common for service-to-service calls.","Internal services talk gRPC; the public API stays REST.","Protobuf|RPC|streaming|code generation|HTTP/2|REST","REST + JSON");
T("GraphQL","ar","Networking","An API query language where the client asks for exactly the fields it needs from one endpoint, reducing over- and under-fetching, at the cost of caching and complexity.","The mobile app uses GraphQL to fetch only the fields on each screen.","schema|resolver|query / mutation|N+1|over-fetching|REST","Fixed-shape REST endpoints");
T("pagination (cursor vs offset)","ar","Networking","Splitting large result lists into pages. Offset pagination skips N rows and gets slow and inconsistent at scale. Cursor pagination continues from the last item seen, which is stable and fast.","Switch to cursor pagination; page 5,000 with OFFSET is crawling.","limit / offset|cursor|keyset|stable ordering|next token|API design","Returning everything in one response");
T("CORS","ar","Networking","Cross-Origin Resource Sharing: browser rules about which websites may call your API from JavaScript. The browser blocks it unless the server sends the right headers.","The call works in curl but fails in the browser: it's CORS.","same-origin policy|preflight|Access-Control headers|origin|cookies|browser security","Server-to-server calls (no CORS)");
T("JWT and session tokens","ar","Networking","A JWT is a signed token carrying claims (user, roles, expiry) that servers verify without a lookup. A session token is an opaque ID looked up server-side, easier to revoke.","JWTs are stateless but hard to revoke; keep them short-lived with refresh tokens.","bearer token|refresh token|claims|signature|cookie|expiry","Server-side session lookup");
T("edge computing","ar","Cloud","Running computation close to users or devices (CDN edge, on-device) to cut latency and bandwidth instead of in a distant central region.","Personalization runs at the edge so it adds only milliseconds.","CDN|edge function|latency|IoT|data locality|central cloud","Centralized single-region compute");
T("region and availability zone","ar","Cloud","A region is a geographic cloud location. Availability zones are separate data centers within it. Spread across zones for resilience; across regions for disaster recovery.","Deploy across three availability zones so one data center loss does not take us down.","multi-AZ|multi-region|disaster recovery|latency|data residency|failover","Single zone deployment");
T("IaaS, PaaS and SaaS","ar","Cloud","Levels of managed cloud. IaaS rents raw infrastructure (virtual machines). PaaS manages the platform for your code. SaaS is a finished application.","We run on PaaS to avoid managing servers; the CRM is SaaS.","managed service|virtual machine|serverless|shared responsibility|FaaS","On-premises hardware you run yourself");
T("vendor lock-in","ar","Cloud","Dependence on one provider's proprietary services that makes switching expensive. Weigh it against the speed and simplicity those services give.","Using the managed queue is fast but increases vendor lock-in.","portability|open standards|abstraction layer|exit cost|multi-cloud|managed service","Portable, provider-neutral design");
T("FinOps and cloud cost management","ar","Cloud","The practice of tracking and optimizing cloud spend through tagging, budgets, rightsizing and commitments, so engineers see the cost of their choices.","FinOps flagged an idle GPU cluster burning thousands per week.","tagging|rightsizing|reserved / spot instances|budget alerts|unit economics|showback","Unmonitored cloud spending");
T("spot and reserved instances","ar","Cloud","Spot instances are spare capacity at steep discounts that can be reclaimed any time. Reserved or committed instances trade a long commitment for a lower price.","Run fault-tolerant batch jobs on spot; steady services on reserved capacity.","on-demand|savings plan|preemption|checkpointing|cost optimization","On-demand pricing (no commitment)");
T("object, block and file storage","ar","Cloud","Object storage (S3) holds files by key at huge scale. Block storage is a raw disk attached to a machine. File storage is a shared filesystem. Each fits different performance and access needs.","Raw data lives in object storage; the database sits on block storage.","S3|EBS|NFS|durability|latency|data lake","Local ephemeral disk");
T("stateless vs stateful services","ar","Architecture","A stateless service keeps no session data between requests, so any instance can serve any request and scaling is easy. Stateful services hold data that must be preserved or sharded.","Keep the web tier stateless; push state into the database and cache.","session|horizontal scaling|sticky sessions|state store|sharding|idempotent","Each is the other: easy scaling vs state management");
T("sidecar and service mesh","ar","Architecture","A sidecar is a helper process deployed next to a service to handle networking concerns. A service mesh uses sidecars everywhere for traffic control, retries, mTLS and telemetry.","The mesh gives every service mTLS and retries without code changes.","Istio|Envoy|mTLS|observability|traffic shifting|operational complexity","Each service implementing it itself");
T("event sourcing","ar","Architecture","Storing every change as an immutable event and deriving current state by replaying them, giving a full audit trail and the ability to rebuild state.","The account balance is computed from the event log, not stored directly.","event store|replay|CQRS|projection|audit trail|snapshot","Storing only the latest state");
T("CQRS","ar","Architecture","Command Query Responsibility Segregation: using separate models for writing data and reading it, so each can be optimized and scaled independently.","Writes go to the transactional store; reads come from a denormalized view.","event sourcing|read model|write model|eventual consistency|denormalization","One model for both reads and writes");
T("saga pattern","ar","Architecture","Coordinating a multi-step business process across services as a series of local transactions, with compensating actions to undo steps if one fails.","If payment fails, the saga cancels the reservation with a compensating action.","compensating transaction|choreography|orchestration|distributed transaction|eventual consistency","Two-phase commit across services");
T("transactional outbox","ar","Architecture","Writing an event to an outbox table in the same database transaction as the data change, then publishing it separately, so state and messages never get out of sync.","The outbox pattern avoids saving the order but losing the OrderPlaced event.","dual write problem|CDC|at-least-once|idempotent consumer|messaging|reliability","Writing to database and broker separately");
T("domain-driven design (DDD)","ar","Architecture","Designing software around the business domain, with a shared vocabulary (ubiquitous language) and models split into bounded contexts.","The ubiquitous language says 'policy', not 'contract', because that's what the business calls it.","bounded context|ubiquitous language|aggregate|entity|domain model|anti-corruption layer","Technology-first or database-first design");
T("bounded context","ar","Architecture","A boundary within which a term and model have one clear meaning. 'Customer' may mean something different in billing and in support, and each context models it separately.","Billing and support are separate bounded contexts with their own customer models.","DDD|service boundary|context map|ubiquitous language|microservices","One giant shared model");
T("hexagonal and clean architecture","ar","Architecture","Styles that keep business logic at the center, independent of frameworks, databases and UI, which plug in through ports and adapters at the edges.","Business rules know nothing about the database, so we can swap it.","ports and adapters|dependency inversion|layers|testability|onion architecture|framework independence","Business logic tangled with framework code");
T("layered architecture","ar","Architecture","Organizing code into layers (presentation, business logic, data access) where each depends only on the layer below.","A classic layered architecture keeps controllers thin and logic in services.","MVC|separation of concerns|tiers|n-tier|repository pattern","Flat, unstructured code");
T("strangler fig pattern","ar","Architecture","Gradually replacing a legacy system by routing pieces of functionality to new code over time until the old system can be retired, instead of a risky big-bang rewrite.","We strangled the billing module first and routed the rest later.","incremental migration|legacy code|facade|feature routing|rewrite","Big-bang rewrite");
T("anti-corruption layer","ar","Architecture","A translation layer that stops a messy or foreign system's model from leaking into your own domain model.","The anti-corruption layer maps the vendor's odd fields into our clean model.","adapter|bounded context|integration|legacy|DDD","Directly adopting the external model");
T("twelve-factor app","ar","Architecture","A set of principles for cloud-friendly apps: config in environment, stateless processes, disposable instances, logs as streams, dev-prod parity, and more.","Per twelve-factor, config comes from environment variables.","environment config|stateless|disposability|dev-prod parity|logs as streams|portability","Environment-specific, hand-configured apps");
T("immutable infrastructure","ar","Cloud","Never patch servers in place. Build a new image and replace instances, so environments are consistent and rollbacks are simple.","We replace instances with a new image rather than SSHing in to patch.","configuration drift|golden image|containers|IaC|rolling update|snowflake server","Mutable, hand-patched servers");
T("GitOps","ar","Cloud","Using a Git repository as the source of truth for infrastructure and deployments, with automated agents making the live system match what is committed.","To change production, open a pull request; the controller applies it.","declarative|Argo CD|Flux|drift detection|pull request|audit trail","Manual changes to live systems");
T("DevOps and SRE","ar","Operations","DevOps is a culture and set of practices joining development and operations around automation and shared ownership. SRE applies software engineering to reliability, using SLOs and error budgets.","The SRE team owns the SLOs; product teams own their services' on-call.","SLO|automation|CI/CD|on-call|toil|you build it you run it","Siloed dev and ops handoffs");
T("platform engineering","ar","Operations","Building an internal platform (golden paths, self-service tooling) that makes it easy for product teams to ship safely without becoming infrastructure experts.","The platform team's golden path spins up a service with CI and monitoring in minutes.","internal developer platform|golden path|self-service|developer experience|paved road|Backstage","Every team assembling its own tooling");
T("service level objective for dependencies","ar","Operations","Your reliability is bounded by your dependencies: a chain of services each at 99.9% yields a lower overall availability, which is why timeouts, fallbacks and redundancy matter.","Five 99.9% dependencies in series give about 99.5% availability.","composite availability|fallback|timeouts|redundancy|critical path|SLO","Assuming dependencies never fail");
T("technical design review","ar","Operations","A structured review of a design before building, where peers challenge assumptions, trade-offs, failure modes and alternatives to catch problems cheaply.","The design review exposed a single point of failure before we built anything.","design doc|RFC|alternatives considered|ADR|risk|stakeholders","Discovering design flaws in production");
T("data residency and sovereignty","ar","Cloud","Rules or requirements that data be stored and processed in a particular country or region, shaping which cloud regions and vendors you can use.","EU customer data must stay in EU regions for data residency.","GDPR|region|compliance|encryption|cross-border transfer|sovereign cloud","Data stored anywhere");
T("multi-cloud and hybrid cloud","ar","Cloud","Multi-cloud uses more than one cloud provider. Hybrid cloud mixes on-premises infrastructure with a public cloud. Both add flexibility and operational complexity.","We stay single-cloud for simplicity but keep an exit plan.","portability|vendor lock-in|Kubernetes|networking|resilience|on-prem","Single-provider deployment");
/* SECURITY, PRIVACY & COMPLIANCE */
T("threat model","se","Security","A structured analysis of what you are protecting, who might attack it, how, and what defenses exist, done early in design (for example with STRIDE).","The threat model showed the admin API was reachable from the internet.","attack surface|STRIDE|assets|adversary|mitigation|risk assessment","Ad hoc security afterthought");
T("attack surface","se","Security","The sum of all points where an attacker could try to get in or extract data: endpoints, ports, inputs, dependencies, people. Reduce it where you can.","Closing unused ports shrank the attack surface.","exposure|least privilege|threat model|public endpoints|dependencies|hardening","Minimal exposed surface");
T("defense in depth","se","Security","Layering several independent protections so that if one fails others still stop the attack, rather than relying on a single control.","Network rules, auth, encryption and monitoring: defense in depth.","layered security|redundancy|zero trust|belt and braces|least privilege","Single point of protection");
T("zero trust","se","Security","A security model that trusts no user, device or network by default and verifies every request, instead of assuming everything inside the perimeter is safe.","Zero trust means being on the VPN does not grant access to the database.","never trust, always verify|identity|microsegmentation|MFA|least privilege|perimeter security","Trusted internal network");
T("encryption at rest and in transit","se","Security","At rest means data is encrypted where it is stored (disk, database, backups). In transit means encrypted while moving across networks (TLS). You usually need both.","Data is encrypted in transit with TLS and at rest with managed keys.","TLS|KMS|AES|key management|envelope encryption|plaintext","Unencrypted storage or traffic");
T("hashing vs encryption","se","Security","Encryption is reversible with a key. Hashing is one-way, so you can verify data without storing it. Store passwords with a slow salted hash, never encrypted or plain.","Hash passwords with bcrypt or Argon2, never reversible encryption.","salt|bcrypt / Argon2|SHA-256|collision|key derivation|checksum","Reversible encryption");
T("public-key cryptography","se","Security","Cryptography using a key pair: a public key anyone can use to encrypt or verify, and a private key kept secret to decrypt or sign. Basis of TLS and signatures.","Share the public key; guard the private key.","private key|certificate|digital signature|RSA / ECC|key exchange|PKI","Shared-secret (symmetric) cryptography");
T("digital signature","se","Security","A value created with a private key that proves who produced data and that it was not altered. Used for software updates, webhooks and tokens.","Verify the webhook's signature before trusting the payload.","private key|verification|integrity|authenticity|HMAC|non-repudiation","Unsigned, unverifiable data");
T("MFA and SSO","se","Security","Multi-factor authentication requires two or more proofs (password plus a device). Single sign-on lets one identity provider log you into many apps.","Enforce MFA for admins and move apps to SSO so offboarding is one switch.","TOTP|passkeys|SAML / OIDC|identity provider|phishing resistance|SCIM","Password-only separate logins");
T("RBAC vs ABAC","se","Security","Role-based access control grants permissions by role (admin, viewer). Attribute-based control decides using attributes of user, resource and context, which is more flexible but harder to manage.","Start with RBAC; add attribute rules when roles explode.","roles|policies|permissions|least privilege|IAM|authorization","Per-user hard-coded permissions");
T("SQL injection","se","Security","An attack where untrusted input is concatenated into a SQL query so the attacker runs their own SQL. Prevent it with parameterized queries.","Never build SQL with string formatting; use parameters.","parameterized query|input validation|ORM|escaping|OWASP|injection","Parameterized queries");
T("XSS (cross-site scripting)","se","Security","An attack that injects malicious script into a page other users view, running in their browser to steal sessions or act as them. Prevent with output encoding and a content security policy.","Unescaped comment text let an attacker run script in other users' browsers: XSS.","output encoding|CSP|sanitization|stored vs reflected|HttpOnly cookie|OWASP","Properly encoded output");
T("CSRF","se","Security","Cross-site request forgery: tricking a logged-in user's browser into sending an unwanted request to a site where they are authenticated. Prevent with CSRF tokens and SameSite cookies.","The forged form posted a transfer using the user's session: CSRF.","CSRF token|SameSite cookie|origin check|session|state-changing request","Requests with verified origin and tokens");
T("SSRF","se","Security","Server-side request forgery: making a server fetch URLs the attacker chooses, often to reach internal services or cloud metadata. Defend with allowlists and network egress controls.","The image-fetch feature allowed SSRF to the cloud metadata endpoint.","allowlist|metadata service|egress filtering|URL validation|internal network","Fetching only from validated destinations");
T("supply chain attack","se","Security","Compromising software through something you depend on (a library, build tool or update) instead of attacking you directly.","A poisoned transitive dependency is a classic supply chain attack.","SBOM|dependency pinning|signing|lockfile|typosquatting|provenance","Fully vetted, pinned dependencies");
T("SBOM","se","Security","A software bill of materials: an inventory of all components and versions in a piece of software, so you can quickly tell if you are affected by a new vulnerability.","The SBOM showed we ship the vulnerable library in three services.","dependency list|CVE|supply chain|SPDX / CycloneDX|vulnerability scanning|audit","Unknown dependency inventory");
T("CVE and vulnerability management","se","Security","A CVE is a public identifier for a known vulnerability. Vulnerability management is continuously scanning, prioritizing by severity and exposure, and patching.","Prioritize the CVE that is exploitable and internet-facing, not just high CVSS.","CVSS|patching|scanner|exploitability|SLA to fix|zero-day","Unpatched, untracked systems");
T("zero-day","se","Security","A vulnerability unknown to the vendor, with no patch available, so defenders have had zero days to fix it.","Mitigate the zero-day with a WAF rule until a patch ships.","exploit|patch|mitigation|disclosure|threat intelligence|WAF","Known, patched vulnerability");
T("penetration test","se","Security","An authorized, simulated attack on your systems by security testers to find exploitable weaknesses before real attackers do.","The pen test chained two low-severity bugs into admin access.","red team|scope|findings|remediation|vulnerability scan|bug bounty","Untested defenses");
T("SAST and DAST","se","Security","Static application security testing scans source code for flaws without running it. Dynamic testing probes the running application from outside. They find different issues.","SAST runs on every pull request; DAST runs against staging nightly.","code scanning|fuzzing|IAST|false positive|CI integration|shift left","Manual review only");
T("secret scanning","se","Security","Automatically detecting credentials (API keys, tokens, passwords) accidentally committed to code or logs, so they can be rotated before abuse.","Secret scanning flagged an AWS key in a commit; rotate it immediately.","key rotation|pre-commit hook|leaked credential|history rewrite|vault","Undetected leaked secrets");
T("PII","se","Privacy & compliance","Personally identifiable information: data that can identify a person (name, email, ID number, and combinations like birthdate plus ZIP). Needs special handling and protection.","Mask PII in logs and restrict access to the raw table.","sensitive data|masking|tokenization|data classification|GDPR|redaction","Anonymized / aggregate data");
T("GDPR","se","Privacy & compliance","The EU's data protection regulation, granting people rights over their personal data (access, deletion, portability) and requiring lawful basis, minimization and breach notification.","A deletion request means purging the user from backups and the warehouse too.","right to erasure|consent|DPA|data subject|controller / processor|DPO","Unregulated data collection");
T("data retention and deletion","se","Privacy & compliance","Policies that define how long data is kept and how it is securely deleted, to limit risk and meet legal requirements.","Logs with user data are retained 30 days, then deleted automatically.","retention policy|TTL|legal hold|purge|backups|minimization","Keeping everything forever");
T("anonymization vs pseudonymization","se","Privacy & compliance","Anonymization irreversibly removes identifiers so people cannot be re-identified. Pseudonymization replaces identifiers with tokens, which can be reversed with extra information and is still regulated.","Hashing emails is only pseudonymization, because it can be linked back.","tokenization|re-identification|k-anonymity|differential privacy|hashing|masking","Raw identifiable data");
T("audit log","se","Privacy & compliance","A tamper-resistant record of who did what, when and from where, supporting investigations and compliance.","The audit log shows which admin exported the table.","immutable|traceability|SIEM|compliance|retention|non-repudiation","No record of actions");
T("SOC 2 and compliance frameworks","se","Privacy & compliance","SOC 2 is an audit report on a company's security, availability and confidentiality controls. Others include ISO 27001, HIPAA and PCI DSS.","Enterprise customers ask for our SOC 2 report before signing.","controls|audit|ISO 27001|HIPAA|PCI DSS|evidence collection","Unaudited controls");
T("WAF and DDoS protection","se","Security","A web application firewall filters malicious web traffic. DDoS protection absorbs floods of traffic meant to knock a service offline.","The WAF blocks injection patterns and the CDN absorbs volumetric DDoS.","rate limiting|bot management|CDN|blocklist|traffic scrubbing|OWASP rules","Origin exposed directly");
T("privilege escalation and lateral movement","se","Security","Privilege escalation is gaining higher access than intended. Lateral movement is moving from one compromised system to others inside a network.","Least privilege and segmentation limit lateral movement after a breach.","least privilege|segmentation|blast radius|credential theft|persistence|detection","Contained, segmented access");
T("incident response","se","Security","The organized process for handling a security incident: detect, contain, eradicate, recover and learn, with clear roles and communication.","The incident response plan names who declares and who talks to customers.","containment|forensics|runbook|postmortem|communication|SIEM","Improvised panic response");
T("key rotation","se","Security","Regularly replacing cryptographic keys and credentials, and being able to do so quickly after a leak, to limit how long a stolen secret works.","Keys rotate every 90 days automatically, with overlap for in-flight requests.","KMS|secrets manager|expiry|short-lived credentials|revocation|automation","Long-lived static credentials");
T("prompt injection defense","se","Security","Treating all retrieved and user-supplied content as untrusted data, limiting tool permissions, requiring approval for risky actions and filtering outputs, so injected instructions cannot cause harm.","Even if the page says ignore your instructions, the agent has no permission to email data out.","least privilege|sandbox|human approval|input isolation|allowlist|output filtering","Following any instruction found in content");
/* MORE LLM & AI ENGINEERING */
T("prompt template","ai","Prompting","A reusable prompt with placeholders filled at run time (user input, retrieved text), so structure stays consistent and testable.","The template inserts the question and the top three passages into fixed instructions.","variables|versioning|few-shot|system prompt|prompt registry|f-string","Ad hoc hand-typed prompts");
T("self-consistency","ai","Prompting","Sampling several reasoning attempts and taking the most common answer, which often beats a single attempt on reasoning tasks at higher cost.","We sampled five solutions and used majority vote: self-consistency.","majority vote|chain of thought|ensemble|temperature|cost|verification","Single-sample answer");
T("ReAct pattern","ai","Agents","An agent pattern that interleaves reasoning and acting: the model thinks, calls a tool, observes the result, and repeats until it can answer.","The ReAct loop searches, reads the result, then decides the next search.","reason and act|tool use|observation|agent loop|scratchpad|planning","Answering without checking tools");
T("reflection and self-critique","ai","Agents","Having a model review and improve its own output or plan before finalizing, sometimes with a separate critic prompt, trading more tokens for quality.","A critique pass catches missing edge cases before the draft is returned.","evaluator-optimizer|revision|verifier|LLM-as-judge|iteration|test-time compute","One-shot output with no review");
T("planning and task decomposition","ai","Agents","Breaking a goal into sub-tasks and ordering them, either up front or adaptively, so an agent handles long, multi-step work reliably.","The agent writes a plan, executes step by step, and revises when a step fails.","subtasks|plan-and-execute|orchestrator-worker|replanning|todo list|checkpoint","Acting step by step with no plan");
T("orchestrator-worker pattern","ai","Agents","A multi-agent design where a lead agent splits the task, delegates pieces to worker agents (often in parallel), then merges their results.","The orchestrator spawns five workers to research subtopics in parallel.","subagent|delegation|parallelism|synthesis|context isolation|supervisor","Single agent doing everything");
T("A2A and agent protocols","ai","Agents","Emerging standards for agents to discover and communicate with each other across vendors, complementing tool protocols like MCP. Details are still evolving.","We expose our agent behind an open protocol so partner agents can call it.","MCP|interoperability|agent card|handoff|authentication|standards","Proprietary one-off integrations");
T("computer-use and browser agents","ai","Agents","Agents that operate software like a person: looking at screenshots or page content, clicking, typing and navigating, useful when no API exists, but slower and riskier.","A browser agent fills the vendor portal form when there is no API.","screenshots|DOM|actions|sandbox|approval|reliability","Direct API integration");
T("tool schema and tool design","ai","Agents","The names, descriptions and parameter definitions that tell a model what a tool does and how to call it. Clear, narrow, well-described tools are called more reliably.","Renaming the tool and adding examples cut mis-calls in half.","JSON schema|function calling|descriptions|error messages|idempotent tools|MCP","Vague, overloaded tools");
T("workflow vs agent","ai","Agents","A workflow follows predefined code paths with LLM calls at set steps. An agent lets the model decide steps dynamically. Prefer the simplest approach that works.","A fixed workflow solved this classification flow; we did not need an agent.","routing|prompt chaining|parallelization|autonomy|predictability|cost","Each is the other end of the control spectrum");
T("query rewriting","ai","Retrieval","Using a model to rephrase, expand or split the user's question into better search queries before retrieval, improving recall.","Query rewriting turned 'it keeps failing' into three specific searches.","query expansion|multi-query|HyDE|conversation context|retrieval|decomposition","Searching the raw user message");
T("HyDE","ai","Retrieval","Hypothetical document embeddings: have a model write a plausible answer, embed that, and use it to search, which can match relevant documents better than the short question.","HyDE improved recall on terse questions.","query rewriting|embeddings|semantic search|retrieval|hallucinated draft","Embedding the question directly");
T("GraphRAG and knowledge graphs","ai","Retrieval","Building a graph of entities and relationships from documents and retrieving by connections, helpful for questions that need multi-hop reasoning across sources.","GraphRAG answers who reports to whom across many documents.","knowledge graph|entities|multi-hop|community summaries|ontology|RAG","Flat chunk retrieval");
T("agentic RAG","ai","Retrieval","Retrieval where an agent decides when and what to search, runs multiple searches, checks results and iterates, rather than one fixed retrieve-then-answer step.","Agentic RAG searches again when the first results look thin.","iterative retrieval|tool use|reranking|verification|planning|cost","Single-shot retrieval");
T("RAG vs long context","ai","Retrieval","A trade-off: put everything in a huge context window (simple, can be costly and diluted) or retrieve only what is relevant (cheaper, depends on retrieval quality). Often combined.","For a 40-page contract we use long context; for 40,000 documents we use RAG.","context window|cost|latency|lost in the middle|prompt caching|recall","Each is the alternative of the other");
T("knowledge graph and ontology","ai","Retrieval","A knowledge graph stores facts as linked entities. An ontology defines the types and relationships allowed, giving shared meaning for data and reasoning.","The ontology says a Drug treats a Condition; the graph holds the facts.","entities|triples|schema|SPARQL|reasoning|semantic web","Unstructured free text");
T("text-to-SQL","ai","Applications","Using an LLM to turn a natural-language question into a SQL query. Needs schema context, validation, read-only access and guardrails to be safe and accurate.","Text-to-SQL answers revenue questions, but queries run read-only with a row limit.","schema linking|semantic layer|validation|read-only|execution accuracy|guardrails","Hand-written SQL by analysts");
T("speculative decoding","ai","Inference","A speed-up technique where a small draft model proposes several tokens and the large model verifies them in one pass, producing the same output faster.","Speculative decoding gave 2x faster generation with identical outputs.","draft model|verification|latency|throughput|acceptance rate|decoding","One token per large-model step");
T("FlashAttention","ai","Inference","An algorithm that computes attention faster and with less memory by reorganizing how data moves through GPU memory, enabling longer contexts.","FlashAttention cut memory so we could train with longer sequences.","attention|memory bandwidth|GPU|kernel|long context|IO-aware","Naive attention implementation");
T("ANN recall tuning","ai","Retrieval","Approximate nearest neighbor indexes trade accuracy for speed. Recall measures how many true nearest neighbors the index returns; tune it against latency and memory.","At ef_search 64 recall is 97% with 5ms latency.","HNSW|IVF|recall|latency|product quantization|build time","Exact brute-force search");
T("embedding model fine-tuning","ai","Retrieval","Adapting an embedding model on your own query-document pairs so retrieval fits your domain's vocabulary and notion of relevance.","Fine-tuning the embedder on 20k support pairs lifted recall at 5.","contrastive learning|hard negatives|domain adaptation|evaluation|retrieval|recall@k","Off-the-shelf generic embeddings");
T("pass@k and code evals","ai","Evaluation","A metric for code generation: the probability that at least one of k sampled solutions passes the unit tests. Unit tests, not text similarity, judge correctness.","pass@1 is 62% and pass@10 is 85%.","unit tests|execution-based eval|sampling|HumanEval|SWE-bench-style tasks|flakiness","Text-overlap metrics");
T("needle-in-a-haystack test","ai","Evaluation","A long-context test that hides a fact in a large document and checks whether the model can retrieve it, probing recall across positions and lengths.","The needle test showed recall drops when the fact sits mid-document.","long context|lost in the middle|recall|position|benchmark|retrieval","Short-context evaluation");
T("pairwise preference evaluation","ai","Evaluation","Comparing two outputs side by side and choosing the better one (by humans or a model) instead of scoring each alone, which is often more reliable. Results can be aggregated into Elo-style rankings.","Raters picked the new answer over the old 64% of the time.","win rate|Elo|position bias|LLM-as-judge|human preference|arena","Absolute 1-to-10 scoring");
T("evaluation rubric","ai","Evaluation","A clear written scoring guide listing criteria and what each score means, used by humans or LLM judges to grade consistently.","The rubric scores accuracy, completeness and tone from 1 to 4.","criteria|grading guide|anchors|calibration|inter-rater agreement|LLM judge","Vague 'is it good?' judgments");
T("refusal and over-refusal","ai","Safety","A refusal is a model declining a request. Over-refusal is declining safe, legitimate requests, which hurts usefulness. Good systems balance safety with helpfulness.","Tuning cut over-refusal on medical questions without loosening real safety limits.","helpfulness|safety policy|false refusal|alignment|classifier|calibration","Complying with harmful requests");
T("constitutional AI","ai","Safety","A training approach where a model critiques and revises its own outputs against a written set of principles, reducing reliance on human labelers for harmful content.","The model was tuned using AI feedback guided by a written constitution.","principles|RLAIF|self-critique|alignment|preference data|safety","Purely human-labeled safety data");
T("data poisoning","ai","Safety","Deliberately corrupting training or retrieval data so a model learns bad behavior or hidden backdoors, or returns attacker-chosen content.","Poisoned documents in the knowledge base steered the assistant's answers.","backdoor|training data integrity|provenance|RAG security|supply chain|validation","Curated, verified data");
T("model extraction and membership inference","ai","Safety","Extraction: recreating a model by querying it. Membership inference: determining whether specific data was in its training set, a privacy risk.","Rate limits and monitoring reduce model extraction attempts.","privacy|API abuse|differential privacy|memorization|rate limiting|distillation attacks","Protected model and training data");
T("watermarking and content provenance","ai","Safety","Techniques that mark AI-generated content or record its origin and edits (such as C2PA metadata) to help detect synthetic media and trace sources.","Generated images carry provenance metadata that tools can verify.","C2PA|synthetic media|detection|metadata|authenticity|deepfake","Unmarked, untraceable content");
T("guard model and classifier","ai","Safety","A separate, usually smaller model that screens inputs or outputs for policy violations, PII or jailbreak attempts, before or after the main model.","A guard model blocks prompt injection attempts before they reach the agent.","moderation|input filter|output filter|latency cost|false positives|policy","Relying on the main model alone");
T("rate limits (RPM and TPM)","ai","Operations","Provider limits on requests per minute and tokens per minute. Exceeding them returns errors, so apps need queues, backoff and capacity planning.","We hit the TPM limit during the batch job, so we added retries with backoff.","429|exponential backoff|quota|batching|priority tiers|capacity","Unlimited throughput");
T("provisioned throughput and batch APIs","ai","Operations","Provisioned throughput reserves model capacity for predictable latency. Batch APIs run large non-urgent jobs asynchronously at a lower price.","Nightly summarization runs on the batch API at half the cost.","reserved capacity|asynchronous|cost|latency|SLA|offline workloads","Real-time on-demand calls for everything");
T("non-determinism and seeds","ai","Operations","LLM outputs can differ run to run even at low temperature, because of sampling, batching and hardware effects. Seeds help reproducibility but do not always guarantee it.","Because outputs vary, our tests assert properties, not exact strings.","temperature|seed|reproducibility|flaky eval|property-based assertions|variance","Deterministic function");
T("prompt compression and compaction","ai","Operations","Shrinking context by summarizing history, dropping low-value content or compressing text so long tasks fit the window and cost less.","At 80% of the window the agent compacts the conversation into a summary.","summarization|context window|token budget|memory|cost|information loss","Appending everything forever");
T("latency budget","ai","Operations","The total time a feature can take end to end, divided among steps (retrieval, model call, tools, rendering) so you can see where to optimize.","With a 3-second budget, retrieval gets 300ms and generation 2s.","p95 latency|streaming|parallel calls|caching|model choice|SLO","Unbounded response time");
T("AI gateway","ai","Operations","A layer between apps and model providers that handles routing, fallbacks, caching, rate limiting, logging, cost tracking and policy in one place.","The AI gateway fails over to a second provider when the first is down.","model routing|fallback|semantic caching|observability|budget limits|abstraction","Each app calling providers directly");
T("evaluation set vs training set contamination in prompts","ai","Evaluation","If your eval examples are also used as few-shot examples or fine-tuning data, scores are inflated. Keep a separate held-out set that never enters prompts or training.","We found eval cases pasted into the prompt, so the pass rate was meaningless.","held-out set|data leakage|few-shot examples|overfitting prompts|golden dataset","Clean, separate held-out evaluation");
T("open-source license vs responsible-use license","ai","Foundations","Traditional open-source licenses (Apache, MIT) allow broad reuse. Many model licenses add use restrictions or conditions, so check what is allowed commercially.","The weights are open, but the license limits some commercial uses.","Apache 2.0|open weights|acceptable use policy|commercial use|derivative models|attribution","Fully unrestricted public domain");
T("agent permissions and approval gates","ai","Safety","Controls that limit what an agent can do (allowlisted tools, scoped credentials) and require human approval before risky or irreversible actions.","Reads are automatic; sending email or deleting data needs approval.","least privilege|human-in-the-loop|scoped tokens|audit log|sandbox|policy","Full autonomy with broad access");
T("eval-driven development","ai","Practice","Building AI features by writing evals first, then iterating on prompts, retrieval and models until the evals pass, like test-driven development for AI.","We wrote 100 eval cases first and only shipped changes that raised the pass rate.","golden dataset|regression suite|TDD|metrics|CI gating|iteration","Shipping on a few good demos");
/* TECHNICAL COMMUNICATION & DELIVERY */
T("stakeholder","cm","Roles & alignment","Anyone affected by or with influence over a project: sponsors, users, teams that depend on it. Identify them early and tailor how you communicate with each.","Share the weekly update with all key stakeholders, not just your manager.","sponsor|end user|decision-maker|buy-in|communication plan|RACI","Uninvolved bystander");
T("DRI (directly responsible individual)","cm","Roles & alignment","The one named person accountable for a task or decision. Shared ownership often means no ownership.","Who is the DRI for the migration? If it is everyone, it is no one.","owner|accountability|RACI|decision-maker|single-threaded owner","Diffuse, shared responsibility");
T("RACI","cm","Roles & alignment","A chart assigning, for each task, who is Responsible (does it), Accountable (owns the outcome), Consulted (gives input) and Informed (kept updated).","The RACI makes it clear security is consulted, not approving every change.","responsible|accountable|consulted|informed|ownership|governance","Unclear ownership");
T("buy-in and alignment","cm","Roles & alignment","Buy-in is genuine support from the people affected. Alignment is shared understanding of goals and plan. Without them, work gets reopened late.","Get alignment on the scope before building, or we will rework it.","consensus|disagree and commit|stakeholder|kickoff|decision record|expectations","Surprise objections late in the project");
T("escalation","cm","Roles & alignment","Raising an issue to someone with more authority when you cannot resolve it yourself, ideally early, factual and with options and a recommendation.","I'm escalating the vendor delay with two options and my recommendation.","blocker|risk|chain of command|options|severity|heads-up","Sitting on a problem silently");
T("sync vs async communication","cm","Communication","Synchronous means real-time (meetings, calls). Asynchronous means replies when convenient (docs, comments, email). Choose async by default for most updates; sync for fast, sensitive or ambiguous issues.","Could this meeting be an async doc with comments?","meeting|written update|time zones|document|focus time|decision log","Each is the other mode");
T("BLUF (bottom line up front)","cm","Communication","Starting a message with the conclusion or ask, then giving supporting detail, so busy readers get the point immediately.","BLUF: we need a decision by Friday on option B; details below.","TL;DR|executive summary|inverted pyramid|headline|ask|clarity","Burying the point at the end");
T("TL;DR and executive summary","cm","Communication","A short summary at the top of a long message or document giving the key points and any required action, so readers can decide whether to read on.","TL;DR: the outage was a bad config push; fixed, with two follow-ups.","summary|abstract|BLUF|key takeaways|skim|scannable","Wall of unsummarized detail");
T("ELI5 and plain language","cm","Communication","Explain Like I'm Five: explaining something in simple terms without jargon. In professional settings, it means tailoring depth and vocabulary to the audience.","Give me the ELI5 version, then the technical detail for engineers.","audience|jargon|analogy|abstraction|layered explanation|clarity","Dense, jargon-heavy explanation");
T("jargon and acronym hygiene","cm","Communication","Defining specialized terms and spelling out acronyms the first time they appear, so readers outside your team are not lost.","Write 'service level objective (SLO)' on first use in the doc.","glossary|first use|audience|accessibility|shorthand|context","Undefined insider shorthand");
T("status update","cm","Communication","A brief, regular report of progress, risks and needs. Strong ones state status (on track, at risk, blocked), what changed, what is next and what you need.","Status: at risk. Reason: vendor API delay. Ask: approval to use the fallback.","RAG status|risks|next steps|blockers|ask|cadence","Silence until something breaks");
T("action item","cm","Communication","A specific task agreed in a meeting or document, with an owner and a due date, so discussion turns into follow-through.","Action item: Priya to send the revised estimate by Wednesday.","owner|due date|follow-up|meeting notes|decision log|accountability","Vague 'we should look into that'");
T("heads-up and FYI","cm","Communication","A heads-up is advance warning of something that may affect someone. FYI (for your information) shares information needing no action. Say which so the reader knows whether to act.","Heads-up: the deploy window moves to 6pm; FYI the dashboard is read-only till then.","notice|no action required|ETA|early warning|courtesy|transparency","Surprising people");
T("ping, ETA, EOD and OOO","cm","Communication","Workplace shorthand. Ping: send a quick message. ETA: estimated time of arrival or completion. EOD: end of day. OOO: out of office.","I'll ping you when I have an ETA; I'm OOO Friday.","timezone|clarify which EOD|availability|SLA|response time|shorthand","Ambiguous, unstated timing");
T("take it offline","cm","Communication","Moving a side discussion out of the meeting to a separate conversation so the group can stay on topic.","Good point, let's take it offline after this meeting.","parking lot|follow-up|agenda|timebox|facilitation|rabbit hole","Letting one thread consume the meeting");
T("disagree and commit","cm","Communication","Voicing your disagreement openly during the decision, then fully supporting the final decision even if it went against you.","I disagree on the approach, but I'll commit to making it work.","consensus|decision-maker|dissent|alignment|trust|buy-in","Passive resistance after the decision");
T("tribal knowledge","cm","Documentation","Important know-how held in people's heads and never written down. A risk when those people leave, and a reason to document.","The deploy steps are tribal knowledge, so let's write a runbook.","bus factor|documentation|onboarding|runbook|knowledge silo|wiki","Documented, discoverable knowledge");
T("README and onboarding docs","cm","Documentation","A README explains what a project is, how to set it up, use it and contribute. Onboarding docs help newcomers become productive quickly.","A good README gets a new engineer running the project in 15 minutes.","setup instructions|quickstart|contributing guide|architecture overview|docs as code|newcomer","Undocumented project");
T("documentation as code","cm","Documentation","Writing docs in plain text (Markdown) in the same repository as the code, reviewed and versioned with it, so docs change with the software.","API docs live in the repo and are updated in the same pull request.","Markdown|version control|docs site|review|CI checks|single source of truth","Stale, separate wiki");
T("design doc and RFC","cm","Documentation","A design doc proposes how to build something: goals, non-goals, options, trade-offs and the recommendation. An RFC (request for comments) circulates a proposal for feedback before a decision.","Write an RFC for the new queue so teams can comment before we commit.","goals / non-goals|alternatives considered|trade-offs|review|decision|ADR","Building without written reasoning");
T("ADR (architecture decision record)","cm","Documentation","A short record of one significant decision: context, options considered, the choice and consequences, so future people know why it was made.","ADR-014 explains why we picked Postgres over DynamoDB.","decision log|context|consequences|status|design doc|history","Decisions lost to memory");
T("changelog and release notes","cm","Documentation","A changelog lists changes per version for developers. Release notes explain notable changes, fixes and breaking changes for users in plain language.","Call out breaking changes at the top of the release notes.","semantic versioning|breaking change|migration guide|deprecation|what's new|upgrade","Silent, unannounced changes");
T("postmortem writing","cm","Documentation","A blameless written account of an incident: impact, timeline, root causes, what went well, and owned follow-up actions with deadlines.","The postmortem lists three action items, each with an owner and a due date.","blameless|timeline|root cause|action items|contributing factors|lessons","Blame or no write-up");
T("requirements: functional vs non-functional","cm","Planning","Functional requirements say what the system does (users can reset a password). Non-functional say how well it does it (performance, security, availability, accessibility).","The non-functional requirement is 99.9% availability and p95 under 300ms.","acceptance criteria|SLO|constraints|specification|quality attributes|use case","Vague wishes");
T("acceptance criteria","cm","Planning","Specific, testable conditions a piece of work must meet to be considered done and accepted by the requester.","Acceptance criteria: given a valid code, when submitted, then the account unlocks.","definition of done|Given-When-Then|user story|testable|scope|QA","Subjective, unmeasurable 'done'");
T("user story and epic","cm","Planning","A user story describes a need from the user's view: As a [user], I want [goal] so that [benefit]. An epic is a large body of work broken into many stories.","The epic 'self-serve billing' splits into twelve stories.","backlog|acceptance criteria|persona|INVEST|slicing|sprint","Task list without a user need");
T("backlog and prioritization","cm","Planning","The ordered list of work waiting to be done. Prioritization decides the order using value, effort, risk and urgency (frameworks include RICE and MoSCoW).","The top of the backlog is ready; the bottom is a wishlist.","RICE|MoSCoW|grooming / refinement|roadmap|trade-off|triage","Unordered pile of requests");
T("sprint, velocity and story points","cm","Planning","A sprint is a fixed work cycle (often 2 weeks). Story points are relative size estimates. Velocity is how many points a team completes per sprint, useful for planning, not for comparing teams.","Velocity is steady around 30 points, so we plan 30.","sprint planning|estimation|capacity|burndown|Scrum|Kanban","Unplanned, open-ended work");
T("t-shirt sizing and estimation","cm","Planning","Estimating effort in rough categories (S, M, L, XL) when precision is not possible, plus a range and confidence level. Estimates are forecasts, not promises.","I'd say L: three to five weeks, medium confidence.","ballpark|range|confidence|story points|uncertainty|cone of uncertainty","False precision");
T("MVP and proof of concept","cm","Planning","A proof of concept (PoC) checks that an idea is feasible. A minimum viable product (MVP) is the smallest version real users can use and learn from.","The PoC proved the model works; the MVP ships to ten pilot customers.","prototype|spike|pilot|iteration|scope|feedback","Fully built product before learning");
T("roadmap","cm","Planning","A high-level plan of what you intend to build and roughly when, showing direction and priorities. A forecast of intent, not a guarantee.","The roadmap commits to themes this quarter, not specific dates.","milestones|themes|now / next / later|dependencies|priorities|vision","Unplanned ad hoc work");
T("OKRs and KPIs","cm","Planning","OKRs pair an ambitious Objective with measurable Key Results to steer direction. KPIs are ongoing health metrics tracked to monitor performance.","Objective: improve onboarding. Key result: activation from 40% to 55%.","metric|goal|north-star metric|leading vs lagging|target|alignment","Goals without measures");
T("leading vs lagging indicators","cm","Planning","Lagging indicators report outcomes after the fact (revenue, churn). Leading indicators predict them earlier (activation, usage) and are easier to influence.","Weekly active use is the leading indicator of renewals.","outcome metric|input metric|KPI|forecast|early signal|churn","Each is the other side of timing");
T("dependency and critical path","cm","Planning","A dependency is work that must finish before other work can proceed. The critical path is the longest chain of dependent tasks, which sets the earliest finish date.","The vendor API is on the critical path, so any slip moves the launch.","blocker|sequencing|Gantt|float / slack|risk|parallelization","Independent, parallel tasks");
T("risk register","cm","Planning","A living list of potential problems with likelihood, impact, owner and mitigation, so risks are managed instead of discovered.","Add data-quality risk to the register with mitigation and an owner.","likelihood|impact|mitigation|contingency|owner|assumptions","Unacknowledged risks");
T("definition of done","cm","Planning","A shared checklist every piece of work must satisfy (tested, reviewed, documented, deployed, monitored) before it counts as finished.","Our definition of done includes dashboards and a runbook.","acceptance criteria|quality bar|checklist|working agreement|review|release","Ambiguous 'it works on my machine'");
T("WIP limit","cm","Planning","A cap on how many tasks can be in progress at once, forcing the team to finish work before starting more and exposing bottlenecks.","With a WIP limit of 3, we finish things before pulling in new work.","Kanban|bottleneck|flow|context switching|cycle time|throughput","Starting everything at once");
T("retrospective","cm","Delivery","A regular team meeting to reflect on what went well, what did not and what to change, ending with concrete, owned improvements.","The retro produced two actions: add a test gate and shorten stand-ups.","blameless|continuous improvement|action items|start / stop / continue|psychological safety|facilitation","Repeating the same mistakes");
T("stand-up","cm","Delivery","A short daily team check-in on progress, plans and blockers, kept brief so detailed discussion happens afterward.","In stand-up: finished the parser, starting tests, blocked on credentials.","daily scrum|blockers|sync|timebox|status|take it offline","Long status meetings");
T("demo and show-and-tell","cm","Delivery","Showing working software to stakeholders to get feedback early. A good demo tells a short story of the user problem, then shows the solution.","Do a five-minute demo at the end of the sprint to confirm direction.","sprint review|feedback|walkthrough|stakeholder|prototype|storytelling","Reporting progress only in slides");
T("handoff","cm","Delivery","Transferring work or responsibility from one person or team to another, which needs context, current state, open issues and who to ask.","The handoff doc lists open risks, links, and who to contact.","transition|context|documentation|ownership|runbook|knowledge transfer","Dropped context");
T("dogfooding","cm","Delivery","Using your own product internally before and during release, so you feel its problems first.","Our team dogfoods the beta, which caught a login bug.","internal use|beta|feedback loop|early adopters|quality|testing","Shipping untested by yourselves");
T("SOW and scope of work","cm","Delivery","A statement of work defines what will be delivered, timeline, responsibilities and acceptance for an engagement. Vague scope invites disputes and scope creep.","The SOW lists deliverables and what is out of scope.","deliverables|milestones|contract|change request|assumptions|out of scope","Open-ended verbal agreement");
T("T-shaped skills","cm","Delivery","Deep expertise in one area (the vertical bar) combined with broad working knowledge of adjacent areas (the horizontal bar), which enables collaboration across disciplines.","She is T-shaped: deep in data engineering, conversant in ML and product.","specialist|generalist|cross-functional|collaboration|depth and breadth|growth","Narrow specialist or shallow generalist");
/* PHRASEBOOK 2: communication swaps */
P("I don't know.","I don't have that yet. I'll check the logs and get back to you by 3pm with what I find.","cm");
P("It's broken, please fix.","Checkout returns a 500 for EU users since 09:40. Impact: roughly 8% of orders. Can someone pick this up?","cm");
P("I think the code is fine.","I'm fairly confident. The unit tests pass and I've reviewed the edge cases, but I haven't load tested it yet.","cm");
P("This will take a while.","Estimate: three to five weeks, medium confidence. The biggest unknown is the vendor API.","cm");
P("We talked about it in the meeting.","Decision recorded in the doc: we're going with option B. Owner is Priya, due Friday.","cm");
P("Can I get a quick call?","Context: we need to decide X by Thursday. Options are A and B. I'd recommend A. Could we take 15 minutes tomorrow, or reply in the doc?","cm");
P("The project is late.","We're at risk of missing March 15. Cause: the dependency slipped two weeks. Options: cut scope, add one engineer, or move the date.","cm");
P("Sorry, I forgot.","I missed that. I'll send it today, and I've added a reminder so it doesn't slip again.","cm");
P("That's not my job.","That sits with the platform team. I'll hand it over with context and the ticket link.","cm");
P("Let's rewrite the docs sometime.","Docs are stale in three places. I'll fix the setup guide this sprint and track the rest in the backlog.","cm");
P("The accuracy is 92%.","Accuracy is 92% on the held-out set, but recall on the minority class is 41%, which matters more for this use case.","ml");
P("The data is noisy.","About 15% of labels disagree between annotators, so the ceiling on accuracy is lower than it looks.","ml");
P("The new model is better.","On the offline set it's up 2 points with a 95% CI of 0.8 to 3.1; an A/B test will confirm the business impact.","ml");
P("My results won't replicate.","I need to pin the seed and dependency versions, and rule out leakage from the shared preprocessing step.","ml");
P("It crashes on bad input.","We should validate at the boundary and fail fast with a clear error rather than propagate bad data.","dt");
P("The query is slow.","The plan shows a sequential scan on 200M rows. An index on user_id and a narrower date range should fix it.","dt");
P("We should move to the cloud.","Before migrating, what are the cost model, data residency constraints and exit plan if we want to leave?","ar");
P("Let's use the newest framework.","What problem does it solve for us? I'd weigh maturity, hiring, maintenance and migration cost against the benefit.","ar");
P("Someone could hack this.","Threat model: untrusted input reaches the query builder. Mitigation: parameterized queries, least-privilege DB role and input validation.","se");
P("We stored the user data.","We store the minimum PII needed, encrypted at rest, with a 30-day retention policy and access logged.","se");
P("The bot is wrong sometimes.","On our golden set it's 88% correct; most failures are retrieval misses, so I'd improve chunking before changing the model.","ai");
P("The AI is expensive.","Cost per resolved ticket is $0.18. Routing easy cases to the small model and caching the system prompt should cut it by about 40%.","ai");
P("Don't trust the AI's output.","Treat model output as untrusted input: validate against a schema, require approval for risky actions and log everything.","ai");
