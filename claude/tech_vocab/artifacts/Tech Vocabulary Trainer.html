T("LLM (large language model)","ai","Foundations","A neural network trained on huge amounts of text to predict the next token, which gives it broad abilities in writing, reasoning and code.","We call the LLM through an API and treat its output as untrusted text.","foundation model|transformer|token|parameters|pretraining|inference","Small task-specific model / rule-based system");
T("token and tokenization","ai","Foundations","Models read text as tokens, chunks of characters or word pieces. Context limits, speed and cost are all measured in tokens.","A page is roughly 500 tokens; we budget tokens, not words.","BPE|context window|token budget|cost per token|vocabulary","Characters or words (tokens are in between)");
T("prompt","ai","Prompting","The input given to a model: instructions, context, examples and the user's question.","The prompt includes the policy text and three worked examples.","system prompt|user prompt|template|prompt engineering|few-shot","Model output / completion");
T("system prompt","ai","Prompting","Standing instructions that set a model's role, rules and style for a whole conversation, usually written by the developer, not the user.","The system prompt tells the assistant to cite sources and refuse legal advice.","instructions|persona|guardrails|prompt injection|context","User message");
T("prompt engineering","ai","Prompting","Designing and iterating prompts (instructions, examples, structure) to get reliable outputs, ideally measured against evals, not by feel.","We improved accuracy by moving the rules before the examples and re-running the eval.","few-shot|chain of thought|prompt template|eval|prompt versioning|context engineering","Changing the model's weights (fine-tuning)");
T("zero-shot and few-shot","ai","Prompting","Zero-shot gives only instructions. Few-shot adds a handful of worked examples in the prompt to show the desired format or behavior.","Three few-shot examples fixed the JSON formatting.","in-context learning|examples|prompt|exemplar selection|one-shot","Fine-tuning on thousands of examples");
T("chain of thought","ai","Prompting","Having a model reason step by step before answering, which often improves accuracy on multi-step problems. Many modern models do this internally.","Asking for step-by-step reasoning improved math accuracy.","reasoning model|scratchpad|test-time compute|self-consistency|tree of thought","Direct answer with no reasoning");
T("sampling parameters (temperature, top-p)","ai","Inference","Settings that control randomness in generation. Low temperature is more deterministic; higher is more varied. Top-p restricts choices to the most probable tokens.","Use temperature 0 for extraction and a higher value for brainstorming.","temperature|top-p|top-k|greedy decoding|determinism|seed","Greedy (always pick the most likely token)");
T("hallucination","ai","Reliability","A model producing fluent but false or unsupported content with confidence, such as invented citations or facts.","The assistant hallucinated a function that does not exist in our SDK.","grounding|RAG|citations|confabulation|factuality|verification","Grounded, source-backed answer");
T("grounding","ai","Reliability","Tying a model's output to trusted sources (retrieved documents, tool results, databases) so claims can be checked.","Grounding every answer in retrieved passages with citations cut hallucinations.","RAG|citations|retrieval|attribution|tool use|verification","Ungrounded generation from memory");
T("RAG (retrieval-augmented generation)","ai","Retrieval","Retrieving relevant documents at question time and adding them to the prompt so the answer is grounded in them instead of only the model's memory.","The support bot uses RAG over the help center, with citations.","embeddings|vector database|chunking|reranking|hybrid search|grounding|context window","Closed-book answering / fine-tuning only");
T("embeddings","ai","Retrieval","Numeric vectors representing the meaning of text, images or other data, so similar items sit close together and can be found by distance.","We embed each chunk and the query, then take the nearest neighbors.","vector|cosine similarity|vector database|semantic search|embedding model|dimensionality","Keyword / exact-match representation");
T("vector database","ai","Retrieval","A database built to store embeddings and quickly find the nearest ones (approximate nearest-neighbor search).","We store 2M chunk vectors in a vector database with metadata filters.","ANN|HNSW|index|cosine similarity|metadata filtering|pgvector|Pinecone","Relational / keyword index");
T("semantic search","ai","Retrieval","Searching by meaning rather than exact words, usually via embeddings, so 'car' can match 'automobile'.","Semantic search found the refund policy even though the user never said 'refund'.","embeddings|keyword search|BM25|hybrid search|query rewriting","Keyword search");
T("chunking","ai","Retrieval","Splitting documents into smaller pieces for indexing and retrieval. Chunk size and overlap strongly affect retrieval quality.","Chunking by section headings beat fixed 500-token chunks.","overlap|chunk size|semantic chunking|metadata|context window|parent-child retrieval","Embedding whole documents");
T("reranking","ai","Retrieval","A second pass that reorders retrieved candidates with a more accurate (and slower) model before they reach the LLM.","Retrieve 50, rerank, and keep the top 5 for the prompt.","cross-encoder|top-k|recall vs precision|hybrid search|relevance score","Using first-pass retrieval order as is");
T("hybrid search","ai","Retrieval","Combining keyword search (like BM25) with semantic vector search, merging both result lists for better coverage.","Hybrid search handles exact part numbers and fuzzy questions.","BM25|semantic search|reciprocal rank fusion|reranking|lexical","Keyword-only or vector-only search");
T("context window","ai","Foundations","The maximum amount of text (in tokens) a model can consider at once: instructions, history, retrieved documents and its own output.","The 300-page document does not fit, so we chunk and retrieve.","token|truncation|chunking|prompt caching|lost in the middle|compaction|stateless","External memory / retrieval");
T("context engineering","ai","Prompting","Deliberately curating everything placed in the model's context (instructions, tools, retrieved data, memory, history) so it has what it needs and nothing distracting.","Most of our quality gains came from better context engineering, not a bigger model.","prompt engineering|retrieval|compaction|agent memory|tool results|token budget","Stuffing everything into the prompt");
T("fine-tuning","ai","Training","Continuing a pretrained model's training on your own examples to change its behavior, style or skills.","We fine-tuned a small model on 5,000 labeled tickets for consistent tone.","LoRA / PEFT|instruction tuning|pretraining|catastrophic forgetting|SFT|distillation","Prompting or RAG (no weight changes)");
T("LoRA and PEFT","ai","Training","Parameter-efficient fine-tuning updates a small set of added weights (like LoRA adapters) instead of the whole model, cutting cost and memory.","LoRA adapters let us fine-tune on one GPU and swap them per customer.","adapter|QLoRA|full fine-tuning|rank|weights|merge","Full fine-tuning of all parameters");
T("RLHF and preference tuning","ai","Training","Training a model with human (or AI) preference judgments so outputs become more helpful and safe. Variants include DPO and RLAIF.","Preference tuning made the model follow instructions more reliably.","reward model|DPO|RLAIF|alignment|PPO|human feedback","Pure next-token pretraining");
T("pretraining","ai","Training","The initial, expensive phase where a model learns general knowledge from a massive corpus, before any task-specific tuning.","Pretraining gives breadth; post-training shapes behavior.","foundation model|corpus|compute|post-training|scaling laws|fine-tuning","Task-specific fine-tuning");
T("distillation","ai","Training","Training a smaller 'student' model to imitate a larger 'teacher' model, keeping much of the quality at lower cost and latency.","We distilled the big model's outputs into an 8B model for production.","teacher-student|synthetic data|compression|quantization|pruning","Training from raw labels only");
T("quantization","ai","Inference","Storing and computing model numbers at lower precision (16-bit to 8 or 4-bit) to cut memory and speed up inference, with a small quality loss.","The 4-bit quantized model fits on one GPU.","FP16 / INT8 / INT4|GGUF|GPTQ|AWQ|VRAM|latency|distillation","Full-precision model");
T("inference","ai","Inference","Running a trained model to produce outputs, as opposed to training it. Most production cost and latency work happens here.","Inference costs dominate our bill, not training.","latency|throughput|batching|KV cache|serving|GPU","Training");
T("time to first token and tokens per second","ai","Inference","Time to first token (TTFT) is the wait before output starts. Tokens per second is the streaming speed after that. Both shape perceived latency.","Streaming made the app feel fast even though total latency was 6s.","streaming|latency|throughput|prefill vs decode|batching","Waiting for the complete response");
T("KV cache","ai","Inference","Stored attention keys and values for tokens already processed, so the model does not recompute them for each new token. Uses lots of memory for long contexts.","Long contexts are memory-bound because of the KV cache.","attention|memory bandwidth|prompt caching|prefill|paged attention","Recomputing every token each step");
T("prompt caching","ai","Inference","Reusing the processed form of a repeated prompt prefix (long instructions, documents) across requests to cut latency and cost.","With prompt caching, the 20k-token system prompt costs a fraction after the first call.","prefix|KV cache|TTL|cache hit|token cost|static content first","Re-processing the full prompt every call");
T("tool use (function calling)","ai","Agents","The model outputs a structured request to call an external function (search, database, calculator), the app runs it, and the result goes back to the model.","The model calls get_order_status and answers from the returned JSON.","function calling|JSON schema|tool result|MCP|API|agent","Pure text generation with no external actions");
T("agent","ai","Agents","A system where an LLM decides which actions to take (tool calls, steps) in a loop toward a goal, observing results and adapting.","The coding agent edits files, runs tests, reads failures and tries again.","agent loop|tools|planning|memory|agentic workflow|harness|sandbox","Fixed pipeline / single prompt");
T("agentic workflow","ai","Agents","A multi-step process where an LLM plans, uses tools and iterates, ranging from fixed steps with LLM calls to fully autonomous loops.","We started with a deterministic workflow and added autonomy only where it paid off.","workflow vs agent|orchestration|routing|human-in-the-loop|evaluator-optimizer","One-shot prompt");
T("multi-agent system","ai","Agents","Several LLM agents with different roles or contexts that coordinate on a task, for example a planner, workers and a reviewer.","A research lead spawns sub-agents that search in parallel and report back.","orchestrator|subagent|handoff|parallelism|shared state|coordination overhead","Single agent");
T("MCP (Model Context Protocol)","ai","Agents","An open standard for connecting AI applications to tools and data sources through a common interface, so integrations are built once and reused.","We exposed our ticketing system as an MCP server so any compatible assistant can use it.","MCP server|MCP client|tools|resources|connector|integration standard","One-off custom integrations per app");
T("structured output","ai","Reliability","Constraining a model to return output in a defined format such as JSON matching a schema, so downstream code can parse it reliably.","We request JSON that conforms to a schema and validate it before use.","JSON schema|constrained decoding|parsing|validation|function calling|Pydantic","Free-form text");
T("guardrails","ai","Safety","Checks and constraints around a model (input filters, output validation, policy rules, permission limits) that keep behavior within bounds.","Guardrails block PII in outputs and cap refunds the agent can issue.","moderation|validation|allowlist|permissions|policy|human approval","Unrestricted model access");
T("prompt injection","ai","Safety","An attack where malicious text in the input or retrieved content tries to override the model's instructions, such as a web page telling the agent to leak data.","Treat retrieved web content as untrusted data, never as instructions: prompt injection defense.","indirect injection|jailbreak|least privilege|sandboxing|input isolation|data exfiltration","Trusted, sanitized input");
T("jailbreak","ai","Safety","A user prompt crafted to push a model past its safety rules into behavior it would normally refuse.","Red-teaming found a role-play jailbreak that bypassed the filter.","prompt injection|red teaming|refusal|safety training|adversarial prompt","Normal, policy-compliant use");
T("red teaming","ai","Safety","Deliberately attacking your own AI system (adversarial prompts, abuse scenarios) to find failures and vulnerabilities before real users do.","Before launch we red-teamed the agent for data leaks and unsafe actions.","adversarial testing|jailbreak|safety evals|threat model|penetration test","Only testing happy-path usage");
T("alignment","ai","Safety","Making AI systems behave according to human intentions and values: helpful, honest and harmless, including in unanticipated situations.","Alignment work shapes how the model handles ambiguous or risky requests.","RLHF|constitution / policy|safety|reward hacking|sycophancy|oversight","Misaligned or reward-hacking behavior");
T("evals","ai","Evaluation","Repeatable tests that measure an AI system's quality on tasks that matter to you, run on every change to catch regressions and guide decisions.","We gate every prompt change on the eval suite: 200 cases, pass rate and cost.","golden dataset|metrics|regression|LLM-as-judge|human grading|eval-driven development","Vibes-based spot checking");
T("LLM-as-judge","ai","Evaluation","Using a (usually strong) model to grade another model's outputs against a rubric. Fast and scalable, but needs calibration against human judgments.","We validated the LLM judge against 100 human-labeled examples before trusting it.","rubric|pairwise comparison|position bias|verbosity bias|human agreement|calibration","Human expert grading");
T("benchmark contamination","ai","Evaluation","When test questions from a benchmark appear in a model's training data, inflating scores. It is data leakage at LLM scale.","The leaderboard score may be contaminated; check our private eval.","data leakage|held-out set|private eval|memorization|decontamination","Fresh, held-out evaluation");
T("golden dataset","ai","Evaluation","A curated set of inputs with trusted expected outputs or grading criteria, used as the standard test for a system.","The golden dataset has 300 real tickets labeled by senior support staff.","ground truth|eval set|annotation|edge cases|versioning|coverage","Ad hoc examples");
T("human-in-the-loop","ai","Safety","Designing a system so a person reviews, approves or corrects AI actions at key points, especially risky or irreversible ones.","The agent drafts the refund; a human approves anything over $100.","approval gate|escalation|oversight|review queue|autonomy level","Fully autonomous operation");
T("multimodal","ai","Foundations","Models that handle more than one kind of data (text, images, audio, video) in input or output.","A multimodal model can read the chart in the screenshot and explain it.","vision|speech|OCR|image generation|cross-modal","Text-only model");
T("foundation model","ai","Foundations","A large model pretrained on broad data that can be adapted to many downstream tasks via prompting or fine-tuning.","We build on a foundation model instead of training from scratch.","pretraining|LLM|transfer learning|adaptation|open-weight","Narrow, task-specific model");
T("open-weight vs closed model","ai","Foundations","Open-weight models publish their trained weights so you can run and tune them yourself. Closed models are accessed only through a provider's API.","Open-weight lets us self-host for data residency; closed APIs give top quality with no ops.","self-hosting|license|API|fine-tuning|data residency|open source","Each is the other: control vs convenience");
T("transformer and self-attention","ai","Foundations","The neural architecture behind modern LLMs. Self-attention lets each token weigh every other token in the context to decide what is relevant.","Attention cost grows with context length, which is why long contexts are expensive.","attention|multi-head|positional encoding|encoder / decoder|context window|KV cache","RNN (processes sequentially)");
T("mixture of experts (MoE)","ai","Foundations","An architecture with many specialist sub-networks where a router activates only a few per token, giving large capacity at lower compute per token.","The MoE model has 400B total parameters but uses far fewer per token.","router|active parameters|sparse model|capacity|dense model","Dense model (all parameters used every token)");
T("scaling laws","ai","Foundations","Empirical relationships showing how model quality improves predictably with more parameters, data and compute.","Scaling laws guided how the lab split compute between model size and data.","parameters|compute|data|diminishing returns|emergent abilities|Chinchilla","Small-model-only progress");
T("reasoning model and test-time compute","ai","Foundations","Models trained to spend extra computation thinking (long internal reasoning) before answering, trading latency and cost for accuracy on hard problems.","For hard planning tasks we pay for a reasoning model; for classification a small one is enough.","chain of thought|thinking budget|latency|cost|verifier|self-consistency","Fast, single-pass answer");
T("batching","ai","Inference","Processing several requests together to use hardware efficiently, raising throughput at some cost to individual latency.","Continuous batching keeps the GPU busy across users.","throughput|latency|continuous batching|GPU utilization|queueing","One request at a time");
T("model routing","ai","Inference","Sending each request to the cheapest model that can handle it well (small model for easy tasks, large for hard ones) to balance cost, speed and quality.","A router sends 80% of tickets to the small model and escalates the rest.","cascade|classifier|fallback|cost optimization|latency budget","One big model for everything");
T("semantic caching","ai","Inference","Reusing a stored response when a new query is similar in meaning (by embedding) to a past one, saving a model call.","Semantic caching answered 25% of FAQ questions with no LLM call.","embeddings|similarity threshold|cache invalidation|staleness|exact-match cache","Calling the model every time");
T("agent memory","ai","Agents","Mechanisms that let an agent retain information across steps or sessions: short-term context, summaries, or long-term stores it can write to and retrieve from.","The agent saves user preferences to a memory store and retrieves them next session.","long-term memory|summarization|vector store|scratchpad|compaction|stateless","Stateless model that forgets between calls");
T("synthetic data","ai","Training","Artificially generated data (often by a model) used to train, test or augment systems when real data is scarce, sensitive or costly.","We generated synthetic support tickets to cover rare edge cases.","data augmentation|distillation|privacy|model collapse|quality filtering","Real, human-collected data");
T("data flywheel","ai","Training","A feedback loop where usage produces data (ratings, corrections, outcomes) that improves the product, attracting more usage.","User corrections feed our eval set and fine-tuning data: a data flywheel.","feedback loop|telemetry|labeling|continual learning|privacy","One-off static dataset");
T("sycophancy","ai","Safety","A model's tendency to agree with or flatter the user instead of being accurate, even when the user is wrong.","The model caved when the user pushed back: sycophancy.","alignment|preference bias|honesty|calibration|pushback tests","Calibrated, honest disagreement");
T("LLM observability","ai","Operations","Tracing and monitoring LLM apps (prompts, retrieved context, tool calls, tokens, latency, cost, user feedback) so you can debug and improve them.","The trace shows retrieval returned the wrong chunk, so the answer was off.","tracing|spans|token usage|cost tracking|feedback|prompt versioning","Opaque model calls");
T("LLMOps and MLOps","ai","Operations","Practices and tooling to build, deploy, monitor and maintain ML or LLM systems reliably: versioning, CI/CD, evaluation, monitoring, rollback.","LLMOps means prompts, models and evals are versioned and released like code.","model registry|CI/CD|monitoring|drift|prompt versioning|reproducibility","Notebook-to-production by hand");
T("vibe coding","ai","Practice","Building software by describing what you want to an AI and accepting its code with little line-by-line review. Fast for prototypes, risky for production without tests and review.","I vibe coded the prototype in an hour, then we reviewed and tested it before shipping.","AI coding assistant|prototype|code review|tests|technical debt|spec","Careful, reviewed, test-backed engineering");
T("sandbox","ai","Safety","An isolated environment where an agent or untrusted code can run with limited permissions, so mistakes or attacks cannot harm real systems.","The agent runs code in a sandbox with no network and a temporary filesystem.","isolation|least privilege|container|permissions|blast radius|allowlist","Running with full production access");
T("harness","ai","Agents","The surrounding software that runs a model in a loop: building prompts, exposing tools, handling results, managing context and enforcing permissions.","The same model performs very differently depending on the harness around it.","agent loop|tools|context management|permissions|orchestrator|SDK","Calling the model once and stopping");
/* PHRASEBOOK: beginner -> senior */
P("The model is 99% accurate!","99% is suspicious. I'd check for leakage and class imbalance before trusting it.","ds");
P("It works on my machine.","It's environment drift. Let's pin dependencies and reproduce it in a container.","sw");
P("The server crashed because too many people used it.","We had no backpressure or rate limiting, so load exceeded capacity and the queue grew unbounded.","sys");
P("The AI made stuff up.","The model hallucinated because the answer wasn't grounded in retrieved sources.","ai");
P("It's slow.","Median is fine, but p99 latency is 2s. Let's find the tail contributor with a trace.","sys");
P("The test fails sometimes.","The test is flaky, probably a race condition on shared state. Quarantine it and open a ticket.","sw");
P("We'll fix it later.","We're taking on technical debt here. Let's log it with an owner and a paydown date.","sw");
P("Can we just try a bigger model?","Let's establish a baseline and an eval first, so we know whether size is actually the bottleneck.","ai");
P("The data looks weird.","I see a distribution shift in the last week. Let me check upstream schema changes and freshness.","de");
P("The new version is better.","It's better on the offline eval, but we should confirm with an A/B test and watch guardrail metrics.","ds");
P("Running it twice breaks things.","The job isn't idempotent. Let's upsert on a key so retries are safe.","sw");
P("The chatbot forgot what I said.","That earlier turn fell out of the context window. We should summarize or retrieve it.","ai");
P("The prediction says 90% sure, so it's right 90% of the time.","That depends on calibration. Let's check a reliability diagram before treating scores as probabilities.","ds");
P("We should rewrite the whole thing.","A rewrite is high risk. Let's strangle it incrementally and refactor behind tests.","sw");
P("Let's use microservices because they scale.","What's the actual bottleneck? A modular monolith might avoid the distributed-systems tax for now.","sw");
P("Add more servers.","Scaling horizontally won't help if the database is the single point of contention. Let's measure first.","sys");
P("The numbers don't match between dashboards.","We have two metric definitions. Let's agree on one governed definition in the semantic layer.","de");
P("The agent did something unexpected.","We need tighter guardrails: least-privilege tools, a sandbox, and human approval for risky actions.","ai");
P("It's accurate on the benchmark.","The benchmark may be contaminated or unrepresentative. What does our private golden set say?","ai");
P("Users are complaining and nobody knew.","We lack observability and SLO-based alerting. Let's add traces and an error-budget burn alert.","sys");
P("Can we ship it Friday?","What's the rollback plan? I'd canary it behind a feature flag and ramp up while watching the error budget.","sys");
P("The correlation is strong, so this causes that.","Correlation isn't causation. Is there a confounder, or can we run an experiment?","ds");
/* ML, STATISTICS & MATH (part A) */
T("linear regression","ml","Algorithms","Fits a straight-line (or plane) relationship between inputs and a numeric target by minimizing squared error. Simple, fast and interpretable.","A linear regression baseline explained 60% of the variance before we tried anything fancier.","coefficients|least squares|R-squared|residuals|regularization|assumptions","Nonlinear models (trees, neural networks)");
T("logistic regression","ml","Algorithms","A classification model that outputs a probability by passing a weighted sum through a sigmoid. Despite the name, it predicts categories, not numbers.","Logistic regression is our default baseline for churn: fast, interpretable and well calibrated.","sigmoid|odds ratio|decision boundary|log loss|regularization|baseline","Linear regression (numeric target)");
T("decision tree","ml","Algorithms","A model that splits data with a series of if/else questions on features, ending in a prediction at each leaf. Easy to read but prone to overfit.","A shallow decision tree gave the business a rule set they could audit.","split|leaf|depth|pruning|Gini impurity|information gain|random forest","Black-box model");
T("random forest","ml","Algorithms","An ensemble of many decision trees trained on random samples of rows and features, averaging their votes to cut variance.","Random forest handled the messy tabular data with almost no tuning.","bagging|feature importance|out-of-bag error|decision tree|variance reduction","Single decision tree");
T("support vector machine (SVM)","ml","Algorithms","A classifier that finds the boundary with the widest margin between classes, and with kernels can separate non-linear data.","An SVM with an RBF kernel worked well on the small, high-dimensional dataset.","margin|kernel trick|support vectors|hyperplane|C parameter","Probabilistic classifier like logistic regression");
T("k-nearest neighbors (k-NN)","ml","Algorithms","Predicts by looking at the k most similar training examples and taking their majority label or average value. No training step, slow at prediction time.","k-NN needs scaled features or distance becomes meaningless.","distance metric|k|lazy learner|curse of dimensionality|scaling|ANN","Parametric model learned during training");
T("naive Bayes","ml","Algorithms","A fast probabilistic classifier that applies Bayes' theorem assuming features are independent given the class. Strong baseline for text.","Naive Bayes spam filtering beat our complex model on a tiny dataset.","Bayes' theorem|independence assumption|bag of words|Laplace smoothing|prior","Models that capture feature interactions");
T("k-means","ml","Algorithms","Clusters data into k groups by repeatedly assigning points to the nearest centroid and moving centroids to the group mean.","We ran k-means with k=5 and checked silhouette scores to justify the number of segments.","centroid|elbow method|silhouette score|initialization|spherical clusters","Density-based clustering (DBSCAN)");
T("DBSCAN","ml","Algorithms","A density-based clustering method that groups points packed closely together and labels isolated points as noise. No need to choose the number of clusters.","DBSCAN found the irregular-shaped clusters k-means missed, and flagged outliers as noise.","eps|min samples|noise points|density|arbitrary shapes|HDBSCAN","k-means (needs k, assumes round clusters)");
T("hierarchical clustering","ml","Algorithms","Builds a tree of clusters by repeatedly merging (or splitting) groups, letting you choose granularity by cutting the dendrogram.","Hierarchical clustering showed the product categories nest naturally.","dendrogram|linkage|agglomerative|distance matrix|cut height","Flat clustering with fixed k");
T("Gaussian mixture model (GMM)","ml","Algorithms","A soft clustering model that treats data as coming from several overlapping normal distributions, giving each point a probability of membership.","A GMM captured overlapping customer segments that hard clustering split badly.","soft assignment|EM algorithm|covariance|BIC|mixture|latent variable","Hard assignment (k-means)");
T("principal component analysis (PCA)","ml","Algorithms","Rotates data onto new axes (components) that capture the most variance, so you can keep a few and drop the rest.","The first 10 principal components explain 92% of the variance.","explained variance|eigenvectors|loadings|scree plot|whitening|dimensionality reduction","Feature selection (keeps original columns)");
T("t-SNE and UMAP","ml","Algorithms","Nonlinear methods that project high-dimensional data into 2D or 3D for visualization, keeping similar points near each other. For exploration, not for measuring distance.","We plotted embeddings with UMAP to see whether the classes separate.","perplexity|neighbors|visualization|manifold|embeddings|PCA","PCA (linear and global)");
T("anomaly detection","ml","Algorithms","Finding rare observations that differ from the normal pattern, using statistical rules or models such as isolation forests and autoencoders.","Anomaly detection flagged a sudden spike in refunds from one region.","isolation forest|one-class SVM|z-score|reconstruction error|seasonality|false alarm rate","Classification with plenty of labeled anomalies");
T("collaborative filtering","ml","Algorithms","Recommends items by using patterns of what similar users liked, without needing item content.","People who bought this also bought that: collaborative filtering at work.","user-item matrix|matrix factorization|implicit feedback|cold start|nearest neighbors","Content-based filtering");
T("matrix factorization","ml","Algorithms","Splits a big user-item matrix into smaller factor matrices of hidden traits, so missing entries can be predicted. Core to classic recommenders.","Matrix factorization learned latent taste dimensions from ratings.","SVD|latent factors|ALS|embeddings|sparsity|regularization","Raw item popularity");
T("multi-armed bandit","ml","Algorithms","A method that balances exploring options and exploiting the best-known one while learning, shifting traffic toward winners during an experiment.","A bandit allocated more traffic to the better headline as evidence grew.","exploration vs exploitation|Thompson sampling|epsilon-greedy|regret|A/B test|contextual bandit","Fixed-split A/B test");
T("bagging, boosting and stacking","ml","Algorithms","Three ensemble strategies. Bagging trains models in parallel on resamples and averages them. Boosting trains sequentially, each fixing the last. Stacking feeds model outputs into a final model.","Bagging cuts variance; boosting cuts bias; stacking blends different model families.","random forest|gradient boosting|meta-learner|out-of-fold predictions|variance|bias","Single model");
T("grid search vs random search","ml","Algorithms","Hyperparameter tuning strategies. Grid search tries every combination in a fixed grid. Random search samples combinations, which usually finds good settings faster.","Random search explored 50 configurations in the time grid search covered 12.","Bayesian optimization|Optuna|search space|early stopping|cross-validation","Hand-tuning by intuition");
T("early stopping","ml","Algorithms","Halting training when validation performance stops improving, preventing overfitting and saving compute.","Early stopping with patience of 5 picked epoch 18.","validation loss|patience|checkpoint|overfitting|regularization","Training for a fixed long schedule");
T("learning curve","ml","Algorithms","A plot of model performance against training size or training time, showing whether more data or a different model would help.","The learning curve has plateaued, so more data will not help; improve features instead.","bias|variance|train vs validation gap|diminishing returns|sample size","Single-point evaluation");
T("ablation study","ml","Algorithms","Removing or disabling one component at a time to measure how much each contributes to the result.","The ablation shows the new feature adds 2 points; the architecture change adds almost nothing.","controlled comparison|component|contribution|baseline|experiment design","Changing many things at once");
T("error analysis","ml","Algorithms","Systematically reading and categorizing a model's mistakes to find patterns, such as which segments or input types fail, so you fix the biggest cause first.","Error analysis showed 40% of misses were scanned documents.","confusion matrix|slicing|failure modes|labeling errors|prioritization","Chasing the aggregate metric only");
T("active learning","ml","Algorithms","Letting the model pick which unlabeled examples a human should label next, usually the most uncertain, to reach good accuracy with fewer labels.","Active learning cut our labeling budget by half.","uncertainty sampling|labeling budget|human-in-the-loop|query strategy|annotation","Labeling randomly sampled data");
T("weak supervision","ml","Algorithms","Creating training labels programmatically from noisy sources such as rules, heuristics and existing models, instead of hand labeling everything.","We used labeling functions and weak supervision to bootstrap 100k labels.","labeling functions|Snorkel|noisy labels|distant supervision|label model","Gold-standard hand labels");
T("self-supervised learning","ml","Algorithms","Learning from unlabeled data by creating the supervision from the data itself, for example predicting a masked word or the next token. How LLMs are pretrained.","Next-token prediction is self-supervised learning at scale.","masked language modeling|contrastive learning|pretraining|unlabeled data|foundation model","Fully supervised learning");
T("data augmentation","ml","Algorithms","Creating extra training examples by transforming existing ones (flips, crops, noise, paraphrases) to improve robustness and reduce overfitting.","Random crops and flips augmented the small image set tenfold.","regularization|synthetic data|invariance|mixup|back-translation","Training only on raw originals");
T("SMOTE and resampling","ml","Algorithms","Ways to handle class imbalance: oversample the rare class (SMOTE creates synthetic neighbors), undersample the common class, or reweight. Apply only to training data.","We oversampled with SMOTE inside each cross-validation fold to avoid leakage.","oversampling|undersampling|class weights|imbalance|data leakage|stratified","Leaving classes imbalanced untreated");
T("stratified sampling","ml","Algorithms","Sampling or splitting so each subgroup (such as each class) keeps its proportion in every sample, giving more representative splits.","Use a stratified split so each fold has 2% fraud like the full data.","stratification|class balance|representative sample|train-test split|cross-validation","Simple random sampling");

T("variance and standard deviation","ml","Statistics & math","Measures of spread. Variance is the average squared distance from the mean; standard deviation is its square root, in the original units.","Mean order value is 52 with a standard deviation of 40: very spread out.","mean|standard error|coefficient of variation|z-score|dispersion|IQR","Central tendency (mean, median)");
T("skewness and kurtosis","ml","Statistics & math","Skewness measures lopsidedness of a distribution; kurtosis measures how heavy its tails are, meaning how prone it is to extreme values.","Revenue is right-skewed with heavy tails, so the median beats the mean.","skewed distribution|heavy tails|log transform|outliers|mean vs median","Symmetric, thin-tailed (normal) distribution");
T("percentiles and quantiles","ml","Statistics & math","Values below which a given share of data falls. The median is the 50th percentile; p95 is the point 95% of values are below.","p95 session length is 42 minutes while the median is 6.","median|quartile|IQR|p99|ECDF|tail","Mean (a single average)");
T("covariance vs correlation","ml","Statistics & math","Covariance shows whether two variables move together but depends on units. Correlation rescales it to a unit-free range from -1 to 1.","Correlation of 0.8 is strong, but it says nothing about causation.","Pearson|Spearman|correlation matrix|causation|scale invariance","Independence (zero correlation, though not always independent)");
T("Pearson vs Spearman correlation","ml","Statistics & math","Pearson measures linear relationships between values. Spearman uses ranks, so it captures any monotonic relationship and resists outliers.","Spearman was high while Pearson was low: the relationship is curved but consistently increasing.","monotonic|rank|linear|outliers|Kendall tau","Non-monotonic relationships neither captures");
T("normal distribution","ml","Statistics & math","The bell-curve distribution defined by mean and standard deviation. Many methods assume it; real data often does not follow it.","About 95% of values fall within two standard deviations of the mean.","Gaussian|z-score|68-95-99.7 rule|central limit theorem|QQ plot|log-normal","Skewed or heavy-tailed distributions");
T("power law and long tail","ml","Statistics & math","A distribution where a few items account for a huge share and many items are rare, as with word frequencies, city sizes and product sales.","Top 1% of users generate half our traffic: classic long tail.","Pareto principle|heavy tail|Zipf's law|popularity bias|log-log plot","Evenly spread, normal-like data");
T("Poisson distribution","ml","Statistics & math","Models counts of events in a fixed interval when events occur independently at a steady average rate, such as support tickets per hour.","Tickets per hour look Poisson, so spikes beyond the expected range are signals.","count data|rate|lambda|overdispersion|negative binomial|exponential","Continuous measurements (normal)");
T("Bernoulli and binomial distributions","ml","Statistics & math","A Bernoulli trial is a single yes/no outcome with probability p. A binomial counts successes across n independent trials.","Each click is a Bernoulli trial; clicks out of 1,000 impressions are binomial.","success probability|conversion rate|proportion test|independence|Beta prior","Continuous outcome");
T("t-test","ml","Statistics & math","A test of whether the means of two groups (or one group against a value) differ more than chance would explain.","A two-sample t-test showed the average session time differed.","Welch's t-test|paired t-test|p-value|assumptions|nonparametric alternative","Chi-square test (for categorical data)");
T("chi-square test","ml","Statistics & math","A test of whether two categorical variables are related, or whether observed counts match expected counts.","A chi-square test of independence checked if plan type relates to churn.","contingency table|expected counts|degrees of freedom|categorical|Fisher's exact test","t-test (compares means)");
T("ANOVA","ml","Statistics & math","Analysis of variance: tests whether the means of three or more groups differ, avoiding many pairwise t-tests.","ANOVA suggests at least one of the four layouts performs differently.","F-test|post hoc test|Tukey|multiple comparisons|groups","Pairwise t-tests inflating error");
T("multiple testing correction","ml","Statistics & math","Adjustments (Bonferroni, false discovery rate) applied when running many tests, so chance findings do not pass as significant.","We tested 20 metrics, so we applied Benjamini-Hochberg to control the false discovery rate.","Bonferroni|FDR|family-wise error rate|p-hacking|alpha","Uncorrected repeated testing");
T("maximum likelihood estimation (MLE)","ml","Statistics & math","Choosing the model parameters that make the observed data most probable. The principle behind many training objectives such as cross-entropy.","Minimizing cross-entropy loss is maximum likelihood for classification.","likelihood|log-likelihood|MAP|Bayesian estimation|parameters","Bayesian estimate with a prior");
T("Bayes' theorem","ml","Statistics & math","Updates the probability of a hypothesis given new evidence: posterior is proportional to likelihood times prior.","Given a rare disease, a positive test still leaves a low posterior: Bayes' theorem and base rates.","prior|likelihood|posterior|base rate|conditional probability|naive Bayes","Ignoring prior probability");
T("Monte Carlo simulation","ml","Statistics & math","Estimating a quantity by running many random simulations and averaging the results, useful when exact math is hard.","We ran 100k Monte Carlo draws to estimate the risk of exceeding budget.","random sampling|simulation|MCMC|bootstrap|variance|convergence","Closed-form analytic solution");
T("Markov chain","ml","Statistics & math","A model of moving between states where the next state depends only on the current state, not the full history.","User navigation was modeled as a Markov chain over pages.","transition matrix|memoryless|state|stationary distribution|MCMC|HMM","Models using long history");
T("entropy","ml","Statistics & math","A measure of uncertainty or surprise in a distribution. High entropy means outcomes are hard to predict; used in decision trees and compression.","The model's output entropy is high, meaning it is unsure which class is right.","information gain|cross-entropy|KL divergence|uncertainty|bits","Certainty / deterministic outcome");
T("KL divergence","ml","Statistics & math","A measure of how one probability distribution differs from another. Used to compare distributions and in training such as VAEs and RLHF penalties.","We penalized KL divergence from the base model so it would not drift too far.","relative entropy|cross-entropy|asymmetry|distribution shift|Jensen-Shannon","Identical distributions (divergence zero)");
T("cross-entropy","ml","Statistics & math","A loss for classification measuring how far predicted probabilities are from the true labels. Lower means the model puts more probability on the right answer.","Language models are trained by minimizing cross-entropy on the next token.","log loss|softmax|entropy|likelihood|perplexity","Squared error (regression loss)");
T("regression to the mean","ml","Statistics & math","Extreme observations tend to be followed by more average ones by chance alone, which can fake improvement after an intervention.","The worst-performing stores improved next quarter, partly regression to the mean.","selection on extremes|control group|noise|natural fluctuation|causal inference","True causal improvement");
T("R-squared","ml","Statistics & math","The share of variance in the target a model explains, from 0 to 1. Can be misleading with many features or nonlinear relationships.","R-squared of 0.4 can be great for human behavior and poor for physics.","adjusted R-squared|residuals|explained variance|overfitting|baseline","Unexplained variance");
T("standard error","ml","Statistics & math","How much a statistic (like a sample mean) would vary across repeated samples. Shrinks as sample size grows; basis of confidence intervals.","Quadrupling the sample cuts the standard error in half.","standard deviation|sample size|confidence interval|sampling distribution|precision","Standard deviation (spread of the data itself)");
T("dot product and cosine similarity","ml","Statistics & math","The dot product multiplies matching components and sums them. Cosine similarity normalizes it to compare direction, not magnitude, and is the standard for comparing embeddings.","Documents with cosine similarity above 0.8 to the query were retrieved.","vectors|embeddings|norm|angle|Euclidean distance|nearest neighbor","Euclidean distance (cares about magnitude)");
T("softmax and logits","ml","Statistics & math","Logits are a model's raw scores. Softmax turns them into probabilities that sum to 1. Temperature divides logits before softmax to sharpen or flatten them.","The model's top logit is far above the rest, so it is very confident.","probabilities|temperature|argmax|cross-entropy|sigmoid|calibration","Hard argmax (one answer, no probability)");
T("L1 and L2 norms","ml","Statistics & math","Ways to measure vector size. L1 sums absolute values; L2 is the square root of summed squares (Euclidean length). They underpin lasso and ridge regularization.","L1 penalties give sparse solutions; L2 penalties shrink weights smoothly.","lasso|ridge|sparsity|Euclidean distance|Manhattan distance|regularization","Unpenalized weights");
/* ML (part B): deep learning & generative, NLP & vision, time series & causal, responsible ML */
T("convolutional neural network (CNN)","ml","Deep & generative","A network that slides small learned filters across an input to detect local patterns, the standard approach for images.","A CNN extracted edges in early layers and object parts in later ones.","convolution|filter|pooling|feature map|ResNet|vision transformer","Fully connected network");
T("RNN and LSTM","ml","Deep & generative","Recurrent networks process sequences step by step, carrying a hidden state. LSTMs add gates to remember longer. Largely replaced by transformers for language.","LSTMs forecast sensor series, but transformers now dominate text.","hidden state|gates|vanishing gradient|GRU|sequence model|transformer","Transformer (processes tokens in parallel with attention)");
T("generative adversarial network (GAN)","ml","Deep & generative","Two networks compete: a generator creates fake samples and a discriminator tries to tell real from fake, pushing realism upward.","GANs produced sharp images but were unstable to train.","generator|discriminator|mode collapse|adversarial training|diffusion model","Diffusion models (more stable)");
T("autoencoder and VAE","ml","Deep & generative","An autoencoder compresses input into a small code and reconstructs it. A variational autoencoder (VAE) learns a smooth probabilistic latent space you can sample from.","Reconstruction error from the autoencoder flags anomalies.","latent space|encoder / decoder|reconstruction error|bottleneck|KL term","Supervised model with labels");
T("diffusion model","ml","Deep & generative","A generative model that learns to reverse a gradual noising process, creating images, audio or video by denoising random noise step by step.","Text-to-image tools are typically diffusion models guided by a text embedding.","denoising|noise schedule|guidance|latent diffusion|sampling steps|U-Net","GAN (single-step generation)");
T("batch normalization and layer normalization","ml","Deep & generative","Techniques that standardize activations inside a network to stabilize and speed up training. Batch norm uses batch statistics; layer norm normalizes per example (used in transformers).","Transformers use layer norm because batch statistics are awkward for sequences.","internal covariate shift|RMSNorm|training stability|scale and shift|batch size","No normalization");
T("residual connection","ml","Deep & generative","A skip path that adds a layer's input to its output, so gradients flow easily and very deep networks train well.","ResNets and transformers both rely on residual connections.","skip connection|vanishing gradient|ResNet|identity mapping|depth","Plain stacked layers");
T("Adam optimizer and momentum","ml","Deep & generative","Adam adapts the step size for each parameter using running averages of gradients and squared gradients; momentum smooths updates in a consistent direction.","We trained with AdamW at 3e-4 and a cosine schedule.","SGD|AdamW|weight decay|learning rate|adaptive optimizer|convergence","Plain SGD with a fixed rate");
T("learning rate schedule and warmup","ml","Deep & generative","Changing the learning rate over training, for example starting small (warmup) then decaying (cosine or step), to stabilize early steps and settle late.","Linear warmup for 1,000 steps stopped the loss spiking at the start.","cosine decay|warmup|step decay|hyperparameter|divergence","Constant learning rate");
T("gradient clipping","ml","Deep & generative","Capping the size of gradients before an update so occasional huge gradients do not destabilize training.","Clipping the gradient norm at 1.0 fixed the loss spikes.","exploding gradient|norm|training stability|optimizer|loss spike","Unbounded gradient updates");
T("latent space","ml","Deep & generative","The internal compressed representation where a model places inputs so similar things are near each other. Embeddings live in latent spaces.","Interpolating in the latent space morphs one face into another.","embedding|representation|manifold|encoder|dimensionality|VAE","Raw input space");
T("word embeddings (word2vec)","ml","Deep & generative","Dense vectors for words learned from context so related words have similar vectors. Static ancestors of modern contextual embeddings.","king minus man plus woman is close to queen in word2vec space.","word2vec|GloVe|contextual embeddings|analogy|vocabulary|OOV","One-hot or bag-of-words vectors");
T("beam search and decoding","ml","Deep & generative","Beam search keeps several of the most likely partial outputs at each step instead of one. Other decoding methods include greedy, top-k and nucleus sampling.","Translation used beam search with width 5; chat uses sampling for variety.","greedy decoding|top-p|top-k|beam width|temperature|likelihood","Single greedy path");
T("perplexity","ml","Deep & generative","A language-model metric: how surprised the model is by real text. Lower means it predicts the text better. It is the exponential of cross-entropy.","Perplexity dropped from 18 to 12 after more training.","cross-entropy|language model|evaluation|token probability|BLEU","Task accuracy (does not measure usefulness directly)");
T("positional encoding","ml","Deep & generative","Information added to token embeddings so a transformer knows word order, since attention itself ignores position. Modern models use rotary (RoPE) variants.","Without positional encoding the model sees a bag of tokens.","RoPE|sinusoidal|context length extension|self-attention|sequence order","Order-agnostic bag of tokens");
T("masked vs causal language modeling","ml","Deep & generative","Masked models (BERT-style) fill in hidden words using context on both sides. Causal models (GPT-style) predict the next token from left context only, which enables generation.","Chat LLMs are causal; many search encoders are masked-style.","BERT|GPT|autoregressive|encoder-only|decoder-only|next-token prediction","Each is the other approach");
T("contrastive learning","ml","Deep & generative","Learning representations by pulling similar pairs together and pushing dissimilar ones apart. Basis of many embedding models.","We trained the embedding model contrastively on query-document pairs.","positive / negative pairs|InfoNCE|embeddings|triplet loss|self-supervised|CLIP","Classification with fixed labels");

T("TF-IDF","ml","NLP & vision","A classic text weighting that scores a word higher if it is frequent in a document but rare across all documents, so distinctive words stand out.","TF-IDF plus logistic regression is a strong text baseline.","term frequency|inverse document frequency|BM25|bag of words|sparse vector","Dense semantic embeddings");
T("bag of words and n-grams","ml","NLP & vision","Bag of words represents text as word counts, ignoring order. N-grams add short word sequences (bigrams, trigrams) to capture some local order.","Bigrams captured 'not good' as different from 'good'.","vocabulary|tokenization|sparse features|n-gram|TF-IDF|word order","Sequence models that keep order");
T("stemming vs lemmatization","ml","NLP & vision","Stemming chops word endings by rule (running becomes run, studies becomes studi). Lemmatization maps words to their dictionary base form using grammar (better becomes good).","Lemmatization is slower but gives cleaner features than stemming.","normalization|stop words|tokenization|morphology|preprocessing","Using raw word forms");
T("named entity recognition (NER)","ml","NLP & vision","Finding and labeling names of people, places, organizations, dates and other entities in text.","NER extracted company names and amounts from contracts.","entity|span|tagging|information extraction|PII detection|BIO tags","Document-level classification");
T("sentiment analysis","ml","NLP & vision","Classifying the emotional tone of text as positive, negative or neutral, or on a scale. Sarcasm and domain language make it harder than it looks.","Sentiment analysis of reviews flagged a drop after the update.","polarity|aspect-based sentiment|lexicon|classification|sarcasm|opinion mining","Factual / topic classification");
T("BLEU and ROUGE","ml","NLP & vision","Overlap metrics comparing generated text to reference text. BLEU is common for translation; ROUGE for summarization. Weak at judging meaning.","ROUGE improved, but human raters preferred the older summaries.","n-gram overlap|reference text|BERTScore|LLM-as-judge|human evaluation","Human or semantic evaluation");
T("object detection","ml","NLP & vision","Locating and labeling multiple objects in an image with bounding boxes and class labels.","The camera model detects pallets and forklifts with confidence scores.","bounding box|IoU|YOLO|non-max suppression|mAP|segmentation","Whole-image classification");
T("image segmentation","ml","NLP & vision","Labeling every pixel with a class or object instance, giving precise shapes instead of boxes.","Segmentation outlined tumors pixel by pixel for the radiologists.","semantic vs instance segmentation|mask|U-Net|IoU|annotation cost","Bounding-box detection");
T("OCR (optical character recognition)","ml","NLP & vision","Converting text in images or scanned documents into machine-readable text.","OCR quality on faded receipts was the bottleneck for the pipeline.","layout analysis|document AI|handwriting recognition|post-correction|confidence","Born-digital text (already machine readable)");
T("ASR and TTS","ml","NLP & vision","Automatic speech recognition turns audio into text. Text-to-speech turns text into audio. Often paired in voice assistants.","The voice agent runs ASR, an LLM, then TTS, so latency adds up at each hop.","speech-to-text|word error rate|diarization|voice cloning|streaming|latency","Typed text interface");

T("stationarity","ml","Time series & causal","A time series is stationary when its statistical properties (mean, variance) do not change over time. Many classic forecasting methods require it, often via differencing.","The series is non-stationary, so we difference it before ARIMA.","differencing|unit root|trend|ADF test|seasonality|detrending","Trending or drifting series");
T("seasonality and trend","ml","Time series & causal","Trend is the long-term direction. Seasonality is a repeating pattern at fixed intervals (daily, weekly, yearly). Decomposing a series separates them from noise.","Sales show weekly seasonality and a rising trend.","decomposition|periodicity|holiday effects|Prophet|residual|cycle","Random noise / irregular component");
T("autocorrelation","ml","Time series & causal","The correlation of a series with its own past values at various lags, revealing repeating patterns and memory.","Strong autocorrelation at lag 7 reveals a weekly cycle.","lag|ACF / PACF|seasonality|autoregressive|white noise|serial correlation","Independent observations");
T("ARIMA","ml","Time series & causal","A classic forecasting model combining autoregression, differencing and moving-average terms for a single time series.","ARIMA is a quick, hard-to-beat baseline for a single stable series.","AR|MA|differencing|SARIMA|baseline|exogenous variables","Deep or global forecasting models");
T("backtesting","ml","Time series & causal","Evaluating a forecasting or trading model by replaying history: train on the past, test on the next period, then roll forward. Never shuffle time series.","Rolling-origin backtests gave a realistic error estimate.","walk-forward validation|time-based split|temporal leakage|forecast horizon|rolling window","Random train-test split on time series");
T("forecast horizon","ml","Time series & causal","How far into the future a forecast must predict. Accuracy typically degrades as the horizon lengthens.","We need a 28-day horizon, so one-step accuracy is not enough.","lead time|multi-step forecast|prediction interval|uncertainty|granularity","Nowcasting (the present)");
T("counterfactual","ml","Time series & causal","What would have happened to the same unit under a different action. You never observe it directly, which is the core problem of causal inference.","The treatment effect is the gap between what happened and the counterfactual.","potential outcomes|treatment effect|causal inference|synthetic control|randomization","Factual / observed outcome");
T("uplift modeling","ml","Time series & causal","Predicting the incremental effect of an action (such as a coupon) on each person, not just who is likely to buy, so you target people the action actually changes.","Uplift modeling avoids discounting customers who would have bought anyway.","persuadables|treatment effect heterogeneity|CATE|incrementality|targeting","Propensity or response modeling");
T("difference-in-differences","ml","Time series & causal","Estimates a treatment's effect by comparing the before-after change in a treated group to the change in an untreated group, netting out shared trends.","We used difference-in-differences to measure the policy rollout in two regions.","parallel trends|control group|natural experiment|panel data|treatment effect","Simple before-after comparison");
T("propensity score matching","ml","Time series & causal","Matching treated and untreated units with similar estimated probabilities of treatment, to mimic randomization with observational data.","We matched users on propensity scores before comparing outcomes.","confounder|balance|observational data|overlap|inverse probability weighting","Randomized assignment");
T("randomized controlled trial (RCT)","ml","Time series & causal","An experiment that randomly assigns units to treatment or control, so any outcome difference can be attributed to the treatment. The gold standard for causality.","An RCT is the cleanest way to estimate the effect of the feature.","randomization|control group|A/B test|blinding|confounding|external validity","Observational study");
T("regression discontinuity","ml","Time series & causal","Estimates a causal effect by comparing units just above and below a cutoff that determines treatment, such as a score threshold.","Students just above the scholarship cutoff are comparable to those just below.","cutoff|running variable|local effect|quasi-experiment|bandwidth","Global regression across the whole range");
T("causal graph (DAG)","ml","Time series & causal","A diagram of variables and arrows showing assumed cause-and-effect, used to decide what to adjust for and what to avoid, such as colliders and confounders.","Drawing the DAG showed we should not control for that mediator.","confounder|collider|mediator|backdoor path|do-calculus|adjustment set","Pure correlation analysis");
T("CUPED","ml","Time series & causal","A variance-reduction technique for experiments that uses each user's pre-experiment behavior to adjust metrics, detecting smaller effects with the same traffic.","CUPED shortened our experiments by 30%.","variance reduction|covariate|pre-period data|statistical power|A/B test","Unadjusted metric comparison");
T("sequential testing and peeking","ml","Time series & causal","Peeking means checking an experiment repeatedly and stopping when significant, which inflates false positives. Sequential methods allow valid early looks.","Peeking daily at a fixed-horizon test doubled our false positive rate.","alpha spending|always-valid p-values|stopping rule|fixed horizon|Bayesian A/B","Single pre-planned analysis at the end");
T("sample ratio mismatch (SRM)","ml","Time series & causal","When the actual split of users between variants differs from the planned split (such as 50/50) more than chance allows, signaling a bug in assignment or logging.","SRM check failed, so we did not trust that experiment's results.","randomization check|chi-square|instrumentation bug|bucketing|trustworthy experiments","Healthy expected split");
T("network effects and interference","ml","Time series & causal","When one user's treatment affects other users (social products, marketplaces), the usual assumption of independent units breaks and naive A/B tests mislead.","Interference between buyers and sellers biased the marketplace test, so we randomized by region.","SUTVA|cluster randomization|spillover|switchback test|marketplace","Independent units");
T("novelty effect","ml","Time series & causal","A temporary change in behavior just because something is new, which fades and can make a test's early lift look better than the long-run effect.","The lift decayed after week two, a classic novelty effect.","primacy effect|long-term holdout|test duration|learning effect|decay","Stable long-run effect");
T("survival analysis","ml","Time series & causal","Methods for modeling time until an event (churn, failure) when some subjects have not had the event yet (censoring). Includes Kaplan-Meier curves and hazard models.","Survival analysis modeled time to churn, treating active users as censored.","censoring|hazard rate|Kaplan-Meier|Cox model|time-to-event|retention","Binary churn flag at a fixed date");

T("algorithmic bias","ml","Responsible ML","Systematic, unfair differences in model outcomes for different groups, caused by skewed data, labels, features or objectives.","Historical hiring data baked algorithmic bias into the resume screener.","fairness|disparate impact|proxy variable|representation|audit|mitigation","Fair, audited outcomes");
T("fairness metrics","ml","Responsible ML","Quantitative definitions of fairness such as demographic parity (equal positive rates), equal opportunity and equalized odds. They can conflict, so choose consciously.","We tracked demographic parity and equalized odds, and documented why we weighted one higher.","demographic parity|equalized odds|calibration across groups|disparate impact|impossibility result","Aggregate accuracy only");
T("model card","ml","Responsible ML","A short document describing a model's intended use, training data, performance across groups, limits and risks, so users deploy it appropriately.","Every released model ships with a model card and known limitations.","datasheet for datasets|system card|transparency|limitations|intended use","Undocumented model");
T("differential privacy","ml","Responsible ML","A mathematical guarantee that adding or removing any one person's data barely changes a result, usually by adding calibrated noise. Controlled by a privacy budget (epsilon).","Published statistics use differential privacy with epsilon 1.","epsilon|noise|privacy budget|k-anonymity|membership inference|DP-SGD","Raw, unprotected outputs");
T("federated learning","ml","Responsible ML","Training a shared model across many devices or sites without moving raw data, by sending only model updates to a central server.","Federated learning trained keyboard suggestions without uploading what users typed.","on-device training|privacy|aggregation|non-IID data|secure aggregation","Centralized training on pooled data");
T("adversarial example","ml","Responsible ML","An input with a tiny, deliberate change that is nearly invisible to humans but makes a model misclassify with confidence.","A sticker on the sign made the vision model read stop as speed limit: an adversarial example.","robustness|perturbation|evasion attack|adversarial training|security","Natural, benign input");
T("out-of-distribution (OOD)","ml","Responsible ML","Inputs that differ from the data the model was trained on, where its predictions are unreliable even if it sounds confident.","The classifier was confidently wrong on OOD images from a new camera.","distribution shift|uncertainty|novelty detection|robustness|fallback","In-distribution data");
T("uncertainty estimation","ml","Responsible ML","Giving a model a measure of how unsure it is, such as predictive intervals or ensemble disagreement, so low-confidence cases can be routed to humans.","Route predictions with high uncertainty to manual review.","epistemic vs aleatoric|ensembles|Bayesian methods|conformal prediction|calibration","Single overconfident point prediction");
T("conformal prediction","ml","Responsible ML","A method that wraps any model to produce prediction sets or intervals with a guaranteed coverage rate (such as 90%), assuming exchangeable data.","Conformal intervals guarantee 90% coverage with no strong model assumptions.","coverage|prediction interval|calibration set|exchangeability|uncertainty","Point predictions without error bars");
T("permutation importance","ml","Responsible ML","Measuring a feature's importance by shuffling its values and seeing how much model performance drops.","Permutation importance showed account_age matters far more than country.","feature importance|SHAP|model-agnostic|correlated features|holdout set","Impurity-based importance (model-specific)");
T("counterfactual explanation","ml","Responsible ML","Explaining a decision by showing the smallest change that would flip it: your loan would be approved if income were 5k higher.","The denial letter included a counterfactual explanation of what to change.","actionable recourse|explainability|minimal change|what-if analysis|SHAP","Opaque yes or no decision");
T("data minimization","ml","Responsible ML","Collecting and keeping only the data actually needed for a purpose, and for only as long as needed, reducing privacy and security risk.","We dropped birthdate from the feature set under data minimization.","GDPR|retention policy|purpose limitation|PII|privacy by design","Hoarding data just in case");
/* LANGUAGES, DATA & TOOLING */
T("virtual environment","dt","Python & tooling","An isolated Python (or other language) setup with its own packages, so projects with different dependencies do not conflict.","Create a virtual environment per project and keep dependencies in a requirements file.","venv|conda|pip|uv|poetry|lockfile|dependency isolation","Installing packages globally");
T("decorator","dt","Python & tooling","A function that wraps another function to add behavior (logging, caching, retries, auth) without changing its code. Written with the @ syntax in Python.","A retry decorator wraps the flaky API call.","wrapper|higher-order function|@functools.cache|closure|middleware|aspect","Editing the function body directly");
T("generator and iterator","dt","Python & tooling","An iterator yields items one at a time. A generator (using yield) produces values lazily, so large or infinite sequences use little memory.","Read the 50GB file with a generator instead of loading it all.","yield|lazy evaluation|memory efficiency|iterable|streaming|comprehension","Building a full list in memory");
T("list comprehension","dt","Python & tooling","A compact Python expression to build a list by transforming or filtering another iterable in one line.","[x*x for x in nums if x > 0] squares the positive numbers.","generator expression|dict comprehension|map / filter|readability|iteration","Explicit for loop with append");
T("GIL (global interpreter lock)","dt","Python & tooling","A lock in standard CPython that lets only one thread run Python bytecode at a time, limiting CPU-bound multithreading. Work around with multiprocessing or native extensions.","CPU-bound work uses multiprocessing because of the GIL.","multiprocessing|threading|asyncio|CPython|native extensions|free-threading","True multi-core thread parallelism");
T("duck typing","dt","Python & tooling","Judging an object by what it can do (its methods) rather than its declared type: if it quacks like a duck, treat it as one.","Anything with a read() method works as a file-like object: duck typing.","protocol|interface|dynamic typing|structural typing|type hints","Strict nominal typing");
T("shallow vs deep copy","dt","Python & tooling","A shallow copy duplicates the outer container but shares inner objects. A deep copy duplicates everything recursively. Mix-ups cause surprising shared-state bugs.","Editing the shallow copy also changed the original's nested list.","reference|mutable|aliasing|copy.deepcopy|side effect|immutability","Sharing the same object (aliasing)");
T("context manager","dt","Python & tooling","A construct (the with statement) that guarantees setup and cleanup, such as opening and closing files or releasing locks, even if errors occur.","with open(path) as f closes the file automatically.","with statement|resource management|__enter__ / __exit__|try-finally|lock","Manual open and close");
T("dataclass","dt","Python & tooling","A Python decorator that auto-generates boilerplate (init, repr, equality) for classes that mainly hold data.","We used frozen dataclasses for immutable config objects.","Pydantic|NamedTuple|attrs|boilerplate|value object|immutability","Hand-written boilerplate classes");
T("Jupyter notebook","dt","Python & tooling","An interactive document mixing code, output and notes, popular for exploration. Great for discovery, risky for production without cleanup and tests.","Prototype in a notebook, then move the logic into tested modules.","cell|kernel|reproducibility|hidden state|nbconvert|exploratory analysis","Versioned, tested package");
T("pandas DataFrame","dt","Python & tooling","A two-dimensional table structure in Python for loading, cleaning, joining and aggregating data, with labeled rows and columns.","Load the CSV into a DataFrame and group by customer.","Series|groupby|merge|index|vectorization|Polars","Plain Python lists and loops");
T("vectorization","dt","Python & tooling","Applying an operation to whole arrays at once in optimized native code, instead of looping element by element in Python.","Replacing the loop with a vectorized NumPy expression made it 100x faster.","NumPy|broadcasting|SIMD|apply vs vectorize|performance","Row-by-row Python loop");
T("broadcasting","dt","Python & tooling","NumPy's rule for combining arrays of different shapes by stretching the smaller one, so you can add a vector to every row of a matrix without loops.","Subtract the column means via broadcasting.","NumPy|shape|vectorization|axis|tensor|reshape","Explicit tiling or loops");
T("memoization","dt","Python & tooling","Caching a function's results by its arguments so repeated calls with the same input return instantly. Only valid for pure functions.","Memoize the expensive lookup to avoid repeated work.","caching|pure function|functools.lru_cache|dynamic programming|TTL","Recomputing every call");
T("regular expression (regex)","dt","Python & tooling","A compact pattern language for matching and extracting text. Powerful but easy to make unreadable or slow.","Use a regex to pull invoice numbers matching INV-\\d{6}.","pattern|capture group|greedy vs lazy|backtracking|anchors|parsing","Structured parsing (JSON, grammar)");
T("environment variable","dt","Python & tooling","A named value supplied by the operating system or runtime that configures a program without changing code, often used for settings and secrets.","Read the API endpoint from an environment variable.","config|.env file|secrets management|twelve-factor|runtime configuration","Hard-coded constants");
T("stack trace","dt","Python & tooling","The printed list of function calls active when an error occurred, read from the bottom (where it failed) up to see how execution got there.","Read the stack trace bottom-up to find the line that raised.","traceback|exception|call stack|breakpoint|debugger|log","Silent failure");
T("profiling","dt","Python & tooling","Measuring where a program spends time or memory so you optimize the real hot spots instead of guessing.","Profiling showed 70% of runtime in JSON parsing.","flame graph|hot path|cProfile|sampling|benchmark|premature optimization","Guessing at performance problems");
T("REPL","dt","Python & tooling","A read-eval-print loop: an interactive prompt that runs each line you type and prints the result, ideal for quick experiments.","Try the snippet in a REPL before committing it.","interactive shell|IPython|notebook|scripting|debugging","Writing and running full scripts");

T("Apache Spark","dt","Big data","A distributed engine that splits data across a cluster and processes it in parallel in memory, for datasets too large for one machine.","The 2TB join runs on Spark with 40 executors.","executor|driver|DataFrame|lazy evaluation|shuffle|Databricks","Single-machine pandas");
T("shuffle and data skew","dt","Big data","A shuffle moves data between machines to regroup it (for joins and group-bys) and is expensive. Skew means a few keys hold most rows, leaving one worker overloaded.","A skewed customer_id caused one task to run for an hour while the rest finished.","partition|salting|broadcast join|hot key|straggler|repartition","Evenly distributed keys");
T("MapReduce","dt","Big data","A programming model that maps work over chunks of data in parallel, then reduces (aggregates) the results. The ancestor of Hadoop and Spark processing.","Word count is the classic MapReduce example.","map|reduce|Hadoop|parallelism|distributed processing|shuffle","Single-threaded processing");
T("Apache Arrow","dt","Big data","A standard in-memory columnar format that lets tools and languages share data without converting or copying it.","Arrow lets pandas, Spark and DuckDB hand data over with near-zero copy.","columnar|zero-copy|Parquet|interoperability|DuckDB|Polars","Per-tool serialization and conversion");
T("DuckDB and embedded analytics","dt","Big data","An in-process analytical SQL database that runs queries on local files (Parquet, CSV) fast, with no server to manage.","We query the Parquet files directly with DuckDB on a laptop.","in-process|OLAP|Parquet|SQLite analogy|vectorized execution|local analytics","Client-server warehouse");

T("ACID transactions","dt","Databases","The guarantees of reliable database transactions: Atomicity (all or nothing), Consistency (rules hold), Isolation (concurrent transactions do not interfere), Durability (committed data survives crashes).","The transfer is wrapped in an ACID transaction, so money is never lost halfway.","commit / rollback|isolation level|atomicity|durability|BASE|two-phase commit","BASE / eventually consistent stores");
T("isolation levels","dt","Databases","Settings that control how much concurrent transactions can see each other's changes, from read committed to serializable. Higher isolation prevents anomalies at a cost in concurrency.","Under read committed, a non-repeatable read can occur; serializable prevents it.","dirty read|phantom read|snapshot isolation|serializable|locking|MVCC","No isolation (anomalies allowed)");
T("N+1 query problem","dt","Databases","A performance bug where code runs one query to fetch a list, then one extra query per item, producing hundreds of round trips instead of one join or batch.","The page ran 501 queries because of an N+1 in the ORM; eager loading fixed it.","ORM|eager loading|join|batching|query count|lazy loading","A single joined or batched query");
T("ORM","dt","Databases","An object-relational mapper that lets code work with database rows as objects (SQLAlchemy, Django ORM, Hibernate). Convenient, but can hide inefficient queries.","The ORM hides SQL, so inspect the generated queries.","SQLAlchemy|N+1|lazy loading|migration|raw SQL|query builder","Hand-written SQL");
T("schema migration","dt","Databases","A versioned, repeatable change to a database's structure (add a column, change a type), applied in order across environments.","Run the migration before deploying the code that needs the new column.","Alembic|Flyway|backward compatibility|expand and contract|rollback|zero-downtime","Manual ad hoc schema edits");
T("stored procedure and trigger","dt","Databases","A stored procedure is reusable logic saved in the database. A trigger runs automatically when a table changes. Powerful, but they hide logic from the application code.","An audit trigger writes each update to a history table.","function|side effect|business logic|observability|testing|database-side logic","Logic kept in application code");
T("view","dt","Databases","A saved query that behaves like a virtual table, simplifying access and hiding complexity. It reads fresh data each time unless materialized.","Analysts query the view, not the six underlying tables.","materialized view|abstraction|permissions|query|CTE","Physical table");
T("NoSQL databases","dt","Databases","Non-relational stores built for scale or flexibility: document (MongoDB), key-value (Redis, DynamoDB), wide-column (Cassandra) and graph (Neo4j).","A key-value store holds sessions; a relational database holds orders.","document store|key-value|graph database|wide-column|eventual consistency|schema-less","Relational (SQL) databases");
T("key-value store and Redis","dt","Databases","A database mapping keys to values with very fast lookups, often in memory. Redis is widely used for caching, queues and rate limiting.","Cache the session in Redis with a 30-minute TTL.","cache|TTL|in-memory|pub/sub|DynamoDB|eviction","Complex relational queries");
T("graph database","dt","Databases","A database that stores entities as nodes and relationships as edges, efficient for traversing connections such as social networks and fraud rings.","A graph database finds accounts sharing devices in two hops.","node|edge|Cypher|traversal|knowledge graph|relationship","Tabular relational storage");
T("full-text search","dt","Databases","Searching text by words with ranking, stemming and relevance, using inverted indexes (Elasticsearch, OpenSearch, Postgres FTS).","Switch from LIKE '%term%' to full-text search to get ranked results.","inverted index|BM25|analyzer|Elasticsearch|tokenization|relevance","Exact string match");
T("time-series database","dt","Databases","A database optimized for timestamped measurements, with fast writes, compression and time-window queries (InfluxDB, TimescaleDB, Prometheus).","Metrics land in a time-series database with 15-second resolution.","downsampling|retention|cardinality|Prometheus|rollup|metrics","General-purpose relational table");
