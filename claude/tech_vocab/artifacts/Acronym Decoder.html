var NAMES={ds:'Data science',de:'Data eng.',sw:'Software',ar:'Architecture',sys:'Systems',se:'Security',ai:'LLM / AI',cm:'Communication'};
var KEY='acr-v1',st={s:{}},app=document.getElementById('app'),tab='B',filter='all',query='',open={},quiz=null,cfg={mode:'mixed',k:'all',n:10};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.s)st=o}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function tag(k){return '<span class="tag t-'+k+'">'+esc(NAMES[k]||k)+'</span>'}
function byA(a){var l=a.toLowerCase();return AC.filter(function(x){return x.a.toLowerCase()===l||x.a.toLowerCase().split(' (')[0]===l})[0]}
function keys(){var k=[];AC.forEach(function(x){if(k.indexOf(x.k)<0)k.push(x.k)});return k}
function setTab(t){tab=t;document.getElementById('tB').setAttribute('aria-selected',t==='B');document.getElementById('tQ').setAttribute('aria-selected',t==='Q');t==='B'?browse():qhome()}
document.getElementById('tB').onclick=function(){setTab('B')};
document.getElementById('tQ').onclick=function(){quiz=null;setTab('Q')};
function rows(){
  var q=query.trim().toLowerCase();
  return AC.filter(function(x){return (filter==='all'||x.k===filter)&&(!q||(x.a+' '+x.x+' '+x.m).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return a.a.toLowerCase()<b.a.toLowerCase()?-1:1});
}
function browse(){
  var h='<input class="search" id="q" type="search" placeholder="Search acronyms or meanings" aria-label="Search" value="'+esc(query)+'"><div class="chips" role="group" aria-label="Filter by track"><button class="chip" aria-pressed="'+(filter==='all')+'" data-f="all">All</button>';
  keys().forEach(function(k){h+='<button class="chip" aria-pressed="'+(filter===k)+'" data-f="'+k+'">'+esc(NAMES[k]||k)+'</button>'});
  h+='</div><p class="cnt" id="cnt"></p><div class="list" id="lst"></div>';
  app.innerHTML=h;
  document.getElementById('q').oninput=function(e){query=e.target.value;list()};
  app.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filter=b.dataset.f;browse()}});
  list();
}
function list(){
  var r=rows(),h='';
  r.forEach(function(x){
    var o=open[x.id],s=st.s[x.id];
    h+='<div class="ar"><button class="arh" data-id="'+x.id+'" aria-expanded="'+!!o+'"><b>'+esc(x.a)+'</b><span class="x">'+esc(x.x)+'</span><i>'+(s?s.r+'/'+(s.r+s.w):'')+'</i></button>';
    if(o){h+='<div class="arb"><div class="tags">'+tag(x.k)+'</div><p>'+esc(x.m)+'</p><p class="reuse">“'+esc(x.e)+'”</p>';
      var rel=x.r.map(function(n){var t=byA(n);return t?'<button class="rel lk" data-go="'+t.id+'">'+esc(t.a)+'</button>':'<span class="rel">'+esc(n)+'</span>'}).join('');
      if(rel)h+='<div class="fld"><span class="lab">See also</span><div class="rels">'+rel+'</div></div>';
      h+='</div>'}
    h+='</div>';
  });
  if(!r.length)h='<div class="ar"><p class="hint" style="padding:14px">No matches.</p></div>';
  document.getElementById('lst').innerHTML=h;
  document.getElementById('cnt').textContent=r.length+' of '+AC.length+' acronyms';
  app.querySelectorAll('.arh').forEach(function(b){b.onclick=function(){open[b.dataset.id]=!open[b.dataset.id];list()}});
  app.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){var t=AC.filter(function(x){return x.id===b.dataset.go})[0];filter='all';query=t.a;open[t.id]=true;browse();window.scrollTo(0,0)}});
}
function qhome(){
  var h='<div class="card"><div class="fld"><span class="lab">Question type</span><select id="cm"><option value="mixed">Mixed</option><option value="dec">Decode: what does it stand for?</option><option value="rec">Recognise: which acronym fits this meaning?</option><option value="use">Usage: which acronym fits this sentence?</option></select></div>'
   +'<div class="fld"><span class="lab">Track</span><select id="ck"><option value="all">All tracks</option>'+keys().map(function(k){return '<option value="'+k+'">'+esc(NAMES[k]||k)+'</option>'}).join('')+'</select></div>'
   +'<div class="fld"><span class="lab">Questions</span><select id="cn"><option>10</option><option>20</option><option>30</option></select></div>'
   +'<button class="btn primary" id="go">Start quiz</button></div>';
  app.innerHTML=h;
  document.getElementById('cm').value=cfg.mode;document.getElementById('ck').value=cfg.k;document.getElementById('cn').value=cfg.n;
  document.getElementById('go').onclick=function(){cfg.mode=document.getElementById('cm').value;cfg.k=document.getElementById('ck').value;cfg.n=+document.getElementById('cn').value;start()};
}
function weight(x){var s=st.s[x.id];if(!s)return 2;return 1+Math.max(0,s.w-s.r)+(s.w>0&&s.r===0?1:0)}
function start(){
  var pool=AC.filter(function(x){return cfg.k==='all'||x.k===cfg.k});
  var bag=[];pool.forEach(function(x){for(var i=0;i<weight(x);i++)bag.push(x)});
  var picked=[],seen={};shuffle(bag).forEach(function(x){if(!seen[x.id]&&picked.length<cfg.n){seen[x.id]=1;picked.push(x)}});
  var modes=['dec','rec','use'];
  quiz={qs:picked.map(function(x){var m=cfg.mode==='mixed'?modes[Math.floor(Math.random()*3)]:cfg.mode;return build(x,m,pool)}),i:0,score:0,miss:[],ans:false};
  ask();
}
function build(x,m,pool){
  var others=shuffle(pool.filter(function(y){return y.id!==x.id}));
  if(others.length<3)others=shuffle(AC.filter(function(y){return y.id!==x.id}));
  var ds=others.slice(0,3);
  var opts=shuffle([x].concat(ds)).map(function(y){return {id:y.id,t:m==='dec'?y.x:y.a,ok:y.id===x.id}});
  var q=m==='dec'?'What does <b class="mono">'+esc(x.a)+'</b> stand for?':m==='rec'?'Which acronym fits this meaning?<br><span class="hint">'+esc(x.m)+'</span>':'Which acronym fits this sentence?<br><span class="hint">“'+esc(maskA(x))+'”</span>';
  return {x:x,m:m,q:q,opts:opts};
}
function maskA(x){var e=x.e,a=x.a.split(' (')[0];var re=new RegExp('\\b'+a.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'\\b','gi');var r=e.replace(re,'_____');return r===e?x.m:r}
function ask(){
  var q=quiz.qs[quiz.i];quiz.ans=false;
  var h='<div class="sbar"><div class="prog"><i style="width:'+(quiz.i/quiz.qs.length*100)+'%"></i></div><span class="n">'+(quiz.i+1)+'/'+quiz.qs.length+'</span><button class="linkbtn" id="qt">Quit</button></div><div class="card"><div class="tags">'+tag(q.x.k)+'</div><p class="q">'+q.q+'</p><div class="opts">'
   +q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+'</div><div id="fb"></div></div>';
  app.innerHTML=h;document.getElementById('qt').onclick=function(){quiz=null;qhome()};
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.i)}});window.scrollTo(0,0);
}
function pick(i){
  if(!quiz||quiz.ans)return;quiz.ans=true;
  var q=quiz.qs[quiz.i],o=q.opts[i],x=q.x,s=st.s[x.id]||(st.s[x.id]={r:0,w:0});
  if(o.ok){quiz.score++;s.r++}else{s.w++;quiz.miss.push(x)}save();
  app.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(q.opts[j].ok)b.classList.add('g2');else if(j===i)b.classList.add('g0')});
  var last=quiz.i===quiz.qs.length-1;
  document.getElementById('fb').innerHTML='<div class="fb"><div><span class="lbl '+(o.ok?'g2':'g0')+'">'+(o.ok?'Correct':'Not quite')+'</span></div><p style="margin:0"><b class="mono">'+esc(x.a)+'</b>: '+esc(x.x)+'. '+esc(x.m)+'</p><p class="reuse" style="margin:0">“'+esc(x.e)+'”</p><div class="actions"><button class="btn primary" id="nx">'+(last?'See result':'Next')+'</button></div></div>';
  var nx=document.getElementById('nx');nx.onclick=function(){quiz.i++;last?fin():ask()};nx.focus();
}
function fin(){
  var n=quiz.qs.length,h='<div class="card"><p class="big2">'+quiz.score+'/'+n+'</p><p class="q">'+(quiz.score===n?'Perfect round.':quiz.score>=n*.8?'Strong. Review the misses below.':'Keep going; the misses come back more often.')+'</p>';
  if(quiz.miss.length){h+='<div><h2>To review</h2><div class="miss">'+quiz.miss.map(function(x){return '<div class="mi"><b>'+esc(x.a)+'</b> · '+esc(x.x)+'<p>'+esc(x.m)+'</p></div>'}).join('')+'</div></div>'}
  h+='</div><div class="actions"><button class="btn" id="hm">Back</button><button class="btn primary" id="ag">Another round</button></div>';
  app.innerHTML=h;document.getElementById('hm').onclick=function(){quiz=null;qhome()};document.getElementById('ag').onclick=start;window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){if(tab==='Q'&&quiz&&!quiz.ans&&e.key>='1'&&e.key<='4')pick(+e.key-1)});
browse();
